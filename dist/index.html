<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>The Scriptorium</title>
<style id="app-style">
*, *::before, *::after { box-sizing: border-box; }

/* Tokens. One accent (scripture teal) spent only where it means something; the primary action is ink. */
:root {
  --paper: #F6F7F9;
  --paper-raised: #FFFFFF;
  --ink: #121417;
  --ink-soft: #585F68;
  --ink-faint: #8B929B;
  --line: #E3E6EA;
  --line-strong: #CBD0D6;
  --accent: #0F6E73;
  --accent-soft: #E6F2F2;
  --accent-ink: #0B5559;
  --edit: #121417;
  --edit-hover: #2B2F35;
  --edit-soft: #E9EAED;
  --conclude: #0F6E73;
  --conclude-hover: #0B5559;
  --conclude-soft: #E6F2F2;
  --danger: #B3261E;
  --danger-soft: #FBE9E7;
  --warn: #9A6B00;
  --warn-soft: #FBF2DC;
  --scrim: rgba(18,20,23,.45);
  --shadow-2: 0 12px 32px rgba(18,20,23,.14);
  --font-body: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  --font-display: var(--font-body);
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0F1114; --paper-raised: #171A1E; --ink: #E8EAED; --ink-soft: #A2A8B0; --ink-faint: #6B727B;
    --line: #262A30; --line-strong: #363B43;
    --accent: #4FB3B8; --accent-soft: #112A2C; --accent-ink: #8FD6D9;
    --edit: #E8EAED; --edit-hover: #FFFFFF; --edit-soft: #262A30;
    --conclude: #4FB3B8; --conclude-hover: #8FD6D9; --conclude-soft: #112A2C;
    --danger: #F28B82; --danger-soft: #3A1F1D; --warn: #E3B341; --warn-soft: #332A12;
    --scrim: rgba(0,0,0,.6); --shadow-2: 0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  --paper: #0F1114; --paper-raised: #171A1E; --ink: #E8EAED; --ink-soft: #A2A8B0; --ink-faint: #6B727B;
  --line: #262A30; --line-strong: #363B43;
  --accent: #4FB3B8; --accent-soft: #112A2C; --accent-ink: #8FD6D9;
  --edit: #E8EAED; --edit-hover: #FFFFFF; --edit-soft: #262A30;
  --conclude: #4FB3B8; --conclude-hover: #8FD6D9; --conclude-soft: #112A2C;
  --danger: #F28B82; --danger-soft: #3A1F1D; --warn: #E3B341; --warn-soft: #332A12;
  --scrim: rgba(0,0,0,.6); --shadow-2: 0 12px 32px rgba(0,0,0,.5);
}

html { color-scheme: light dark; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
#app-root { max-width: 1120px; margin: 0 auto; padding: 36px 24px 96px; }
.wrap { display: flex; flex-direction: column; gap: 20px; }

/* Head */
.hero { max-width: 760px; }
.eyebrow { margin: 0 0 6px; font: 500 13px/1 var(--font-body); color: var(--ink-faint); }
.title-field { display: block; width: 100%; border: none; background: transparent; padding: 0; font: 600 clamp(26px, 3.4vw, 34px)/1.15 var(--font-body); letter-spacing: -.02em; color: var(--ink); border-bottom: 1px solid transparent; }
.title-field::placeholder { color: var(--ink-faint); font-weight: 500; }
.title-field:focus { outline: none; border-bottom-color: var(--ink); }
.dek { margin: 10px 0 0; max-width: 62ch; color: var(--ink-soft); font-size: 14.5px; }

.tip { border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; background: var(--paper-raised); }
.tip summary { cursor: pointer; font: 500 13.5px var(--font-body); color: var(--ink-soft); }
.tip summary:hover { color: var(--ink); }
.tip ol { margin: 10px 0 2px; padding-left: 18px; color: var(--ink-soft); font-size: 13.5px; }
.tip li { margin: 5px 0; }
.tip strong { color: var(--ink); font-weight: 600; }

.search-panel { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; }
.search-panel label { display: block; font: 600 13.5px var(--font-body); color: var(--ink); margin-bottom: 2px; }
.search-panel .hint { margin: 0 0 8px; font-size: 13px; color: var(--ink-soft); max-width: 68ch; }
.search-panel textarea { width: 100%; resize: vertical; min-height: 40px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); color: var(--ink); font: 400 13.5px/1.5 var(--font-mono); padding: 8px 10px; }
.search-panel textarea:focus, .pane textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--edit-soft); }

/* Action bar */
.action-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; background: var(--paper); padding: 10px 0; border-bottom: 1px solid var(--line); }
.status-line { margin: 0; flex: 1; min-width: 160px; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.action-bar-end { display: flex; gap: 8px; margin-left: auto; align-items: center; }
.bar-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.btn { appearance: none; border: 1px solid var(--line-strong); border-radius: 5px; padding: 7px 14px; font: 500 13.5px var(--font-body); color: var(--ink); background: var(--paper-raised); cursor: pointer; transition: background-color .12s ease, border-color .12s ease, color .12s ease; }
.btn:hover:not(:disabled) { border-color: var(--ink-faint); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:focus-visible, .link-btn:focus-visible, .icon-btn:focus-visible, .collapse-btn:focus-visible, .copy-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { cursor: not-allowed; opacity: .45; }
.btn-sm { padding: 5px 10px; font-size: 12.5px; }
.btn-edit { background: var(--edit); border-color: var(--edit); color: var(--paper); font-weight: 600; }
.btn-edit:hover:not(:disabled) { background: var(--edit-hover); border-color: var(--edit-hover); }
.btn-conclude { background: var(--conclude); border-color: var(--conclude); color: #FFFFFF; font-weight: 600; }
.btn-conclude:hover:not(:disabled) { background: var(--conclude-hover); border-color: var(--conclude-hover); }
.btn-ghost { background: transparent; color: var(--ink-soft); }
.btn-ghost:hover:not(:disabled) { color: var(--ink); }
.btn-quiet-danger { background: transparent; color: var(--ink-soft); }
.btn-quiet-danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
.btn-danger { background: var(--danger); border-color: var(--danger); color: #FFFFFF; font-weight: 600; }
.btn-danger:hover:not(:disabled) { filter: brightness(.92); }
.link-btn { border: none; background: none; padding: 0; cursor: pointer; font: 500 13px var(--font-body); color: var(--accent-ink); text-decoration: underline; text-underline-offset: 2px; }
.link-btn:hover { color: var(--ink); }

.speed-pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
.speed-pick select { font: 500 12.5px var(--font-body); color: var(--ink); background: var(--paper-raised); border: 1px solid var(--line-strong); border-radius: 5px; padding: 5px 6px; }
.speed-pick input[type=checkbox] { accent-color: var(--ink); margin: 0 2px 0 0; }
.save-state { margin: 0; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }
.save-state.is-saving { color: var(--ink-soft); }

/* Overview */
.overview { border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; background: var(--paper-raised); }
.overview h3 { margin: 0 0 8px; font: 600 14px var(--font-body); color: var(--ink); }
.overview h3 span { font-weight: 400; color: var(--ink-faint); }
.overview-list { margin: 0; padding-left: 18px; color: var(--ink-soft); font-size: 13.5px; }
.overview-list li { margin: 4px 0; }
.overview-list strong { color: var(--ink); font-weight: 600; }

/* Script cards */
.sections { display: flex; flex-direction: column; gap: 12px; }
.section-card, .skeleton-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 16px; }
.section-card.is-collapsed { padding-bottom: 12px; }
.section-card.is-collapsed .section-head { margin-bottom: 0; }
.section-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.section-name { flex: 1; min-width: 0; border: none; background: transparent; font: 600 16px var(--font-body); letter-spacing: -.01em; color: var(--ink); padding: 3px 2px; border-bottom: 1px solid transparent; }
.section-name::placeholder { color: var(--ink-faint); font-weight: 500; }
.section-name:focus { outline: none; border-bottom-color: var(--ink); }
.section-meta { margin: 0 6px 0 0; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }

.chip { flex-shrink: 0; font: 500 12px var(--font-body); padding: 3px 9px; border-radius: 4px; border: 1px solid var(--line); white-space: nowrap; color: var(--ink-soft); background: transparent; }
.chip-editing { border-color: var(--line-strong); color: var(--ink); }
.chip-edited { border-color: transparent; background: var(--conclude-soft); color: var(--conclude-hover); }
.chip-error, .chip-stale { border-color: transparent; background: var(--warn-soft); color: var(--warn); }

.icon-btn, .collapse-btn { flex-shrink: 0; width: 28px; height: 28px; border-radius: 5px; border: 1px solid transparent; background: transparent; color: var(--ink-faint); line-height: 1; cursor: pointer; }
.icon-btn { font-size: 18px; } .collapse-btn { font-size: 12px; }
.icon-btn:hover, .collapse-btn:hover { border-color: var(--line-strong); color: var(--ink); background: var(--paper); }
.icon-btn:hover { color: var(--danger); }

.section-body { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 880px) { .section-body { grid-template-columns: 1fr 1fr; } }
.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.pane label, .pane-head label { display: block; margin: 0; font: 500 12.5px var(--font-body); color: var(--ink-faint); }
.pane textarea { width: 100%; min-height: 200px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); color: var(--ink); font: 400 13.5px/1.6 var(--font-mono); padding: 10px 12px; }
.corrected-output { min-height: 200px; max-height: 440px; overflow-y: auto; border: 1px solid var(--line); border-radius: 5px; background: var(--paper-raised); color: var(--ink); font: 400 13.5px/1.6 var(--font-mono); padding: 10px 12px; white-space: pre-wrap; }
.corrected-output.is-empty { color: var(--ink-faint); font-family: var(--font-body); }
.corrected-output.is-blocks { white-space: normal; font: 400 14px/1.65 var(--font-body); }
.corrected-output.is-blocks p { margin: 0 0 10px; }
.corrected-output.is-blocks p:last-child { margin-bottom: 0; }
.verse-block { margin: 10px 0 12px; padding: 2px 0 2px 12px; border-left: 2px solid var(--accent); }
.verse-block strong { font-weight: 600; color: var(--ink); }
.verse-block.is-uncertain { border-left-color: var(--warn); }
.copy-btn { border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink-soft); border-radius: 4px; font: 500 12px var(--font-body); padding: 3px 8px; cursor: pointer; }
.copy-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
.copy-btn.is-done { border-color: var(--conclude); color: var(--conclude-hover); }

/* Details under a card */
.section-details { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.section-summary { margin: 0 0 10px; color: var(--ink-soft); font-size: 13.5px; max-width: 72ch; }
.detail-block { margin-top: 12px; }
.detail-block h4, .detail-fold > summary { margin: 0 0 6px; font: 600 13px var(--font-body); color: var(--ink); }
.detail-fold > summary { cursor: pointer; color: var(--ink-soft); }
.detail-fold > summary:hover { color: var(--ink); }
.misheard-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.misheard-table th { text-align: left; font: 500 12px var(--font-body); color: var(--ink-faint); padding: 4px 8px; border-bottom: 1px solid var(--line-strong); }
.misheard-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); }
.misheard-table tr:last-child td { border-bottom: none; }
.misheard-table .mono { font-family: var(--font-mono); font-size: 12.5px; }
.misheard-table td.was { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--danger); text-decoration-thickness: 1px; }
.misheard-table td.now { color: var(--ink); font-weight: 500; }
.verse-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
.verse-list li { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 10px; font-size: 13px; align-items: baseline; }
.verse-ref { font-weight: 600; color: var(--accent-ink); }
.verse-ref em { font-weight: 400; color: var(--ink-faint); }
.verse-list li.is-uncertain .verse-ref { color: var(--warn); }
.verse-spoken { display: block; font-weight: 400; font-size: 12px; color: var(--ink-faint); }
.verse-quote { color: var(--ink-soft); font-family: var(--font-mono); font-size: 12px; }
.verse-warn { display: block; font-family: var(--font-body); font-size: 12.5px; color: var(--warn); margin-top: 2px; }
@media (max-width: 600px) { .verse-list li { grid-template-columns: 1fr; gap: 2px; } }
.flag-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.flag-list li { display: flex; flex-direction: column; gap: 2px; border-left: 2px solid var(--warn); padding: 2px 0 2px 10px; }
.flag-quote { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink); }
.flag-issue { font-size: 13px; color: var(--ink-soft); }
.section-error { margin: 12px 0 0; font-size: 13px; color: var(--danger); }
.stale-note { margin: 8px 0 0; font-size: 13px; color: var(--warn); }
.redo-line { margin: 10px 0 0; text-align: right; }

/* Finish */
.conclude-bar { border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; background: var(--paper-raised); }
.approve-prompt { margin: 0; font: 600 15px var(--font-body); color: var(--ink); }
.approve-row { display: flex; align-items: flex-start; gap: 10px; font-size: 13.5px; color: var(--ink); cursor: pointer; }
.approve-row input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--conclude); }
.approve-row input:disabled { cursor: not-allowed; }
.conclude-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.doc-result, .doc-link-line { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.doc-result a, .doc-link-line a { color: var(--accent-ink); font-weight: 500; }
.doc-result.is-error { color: var(--danger); }

/* Notices and the confirm step */
.notice { margin: 0; padding: 10px 14px; border-radius: 5px; font-size: 13.5px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); }
.notice-warn { border-color: var(--warn); background: var(--warn-soft); }
.notice-info { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.notice-dismiss { flex-shrink: 0; border: none; background: none; cursor: pointer; color: var(--ink-faint); font-size: 16px; line-height: 1; padding: 0 2px; }
.notice-dismiss:hover { color: var(--ink); }
.modal-backdrop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--scrim); }
.modal-card { width: 100%; max-width: 440px; background: var(--paper-raised); border: 1px solid var(--line-strong); border-radius: 8px; box-shadow: var(--shadow-2); padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.modal-title { margin: 0; font: 600 17px var(--font-body); letter-spacing: -.01em; color: var(--ink); text-wrap: balance; }
.modal-body { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.modal-warn { margin: 0; font-size: 13.5px; color: var(--ink); border-left: 2px solid var(--warn); padding: 2px 0 2px 10px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 2px; }

/* Loading */
.skeleton-line { height: 12px; border-radius: 4px; background: var(--line); margin: 10px 0; }
.skeleton-line.w40 { width: 40%; } .skeleton-line.w70 { width: 70%; } .skeleton-line.tall { height: 120px; margin-top: 14px; }
.action-bar .btn:disabled, .action-bar input:disabled { opacity: .45; }
input:disabled, textarea:disabled { cursor: wait; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Timed captions */
.caption-fold { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.caption-fold > summary { cursor: pointer; font: 500 12.5px var(--font-body); color: var(--ink-faint); }
.caption-fold > summary:hover { color: var(--ink); }
.caption-optional { font-weight: 400; }
.caption-fold .hint, .caption-row .hint { margin: 8px 0; font-size: 13px; color: var(--ink-soft); max-width: 68ch; }
.caption-row .hint { margin: 0; }
.caption-fold textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--paper); color: var(--ink); font: 400 13px/1.5 var(--font-mono); padding: 8px 10px; }
.caption-fold textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px var(--edit-soft); }
.caption-bar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-top: 8px; }
.caption-note { margin: 0; font-size: 13px; color: var(--ink-soft); }
.caption-note.is-warn { color: var(--warn); }
.caption-bar .copy-btn { flex: none; padding: 5px 10px; }
.caption-bar .copy-btn:disabled { opacity: .45; cursor: not-allowed; }

/* The library of books */
.library-title { margin: 0; font: 600 clamp(26px, 3.4vw, 34px)/1.15 var(--font-body); letter-spacing: -.02em; color: var(--ink); }
.book-list { display: flex; flex-direction: column; gap: 10px; }
.book-row { display: flex; align-items: center; gap: 14px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: 6px; padding: 2px 16px 2px 2px; }
.book-row:hover { border-color: var(--line-strong); }
.book-row.is-busy { opacity: .6; }
.book-open { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; text-align: left; border: none; background: none; border-radius: 5px; padding: 12px 14px; cursor: pointer; color: var(--ink); font-family: var(--font-body); }
.book-open:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.book-name { font: 600 16px/1.3 var(--font-body); letter-spacing: -.01em; overflow-wrap: anywhere; }
.book-open:hover:not(:disabled) .book-name { color: var(--accent-ink); }
.book-name.is-untitled { color: var(--ink-faint); font-weight: 500; }
.book-meta { font: 400 13px var(--font-body); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.book-delete { flex: none; color: var(--ink-soft); }
.book-delete:hover:not(:disabled) { color: var(--danger); }
.library-empty { margin: 0; padding: 28px 20px; border: 1px dashed var(--line-strong); border-radius: 6px; color: var(--ink-soft); font-size: 14px; text-align: center; }
.back-line { margin: 0 0 -8px; }
.version-line { margin: 0; font-size: 12px; color: var(--ink-faint); text-align: right; }

/* Pull from Descript */
.pull-panel { border: 1px solid var(--line-strong); border-radius: 6px; padding: 14px 16px; background: var(--paper-raised); display: flex; flex-direction: column; gap: 10px; }
.pull-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.pull-head h3 { margin: 0; font: 600 14px var(--font-body); color: var(--ink); }
.pull-panel .hint { margin: 0; font-size: 13px; color: var(--ink-soft); max-width: 72ch; }
.pull-path { margin: 0; font-size: 13px; color: var(--ink-soft); }
.pull-path strong { color: var(--ink); font-weight: 600; }
.pull-sep { color: var(--ink-faint); }
.pull-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 5px; max-height: 340px; overflow-y: auto; }
.pull-list li + li { border-top: 1px solid var(--line); }
.pull-folder { display: block; width: 100%; text-align: left; border: none; background: none; padding: 8px 12px; cursor: pointer; font: 500 13.5px var(--font-body); color: var(--ink); }
.pull-folder:hover { background: var(--paper); color: var(--accent-ink); }
.pull-folder:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pull-item { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 7px 12px; cursor: pointer; font-size: 13.5px; color: var(--ink); }
.pull-item:hover { background: var(--paper); }
.pull-item input { accent-color: var(--ink); margin: 0; align-self: center; }
.pull-name { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
.pull-tag { font-size: 12px; color: var(--ink-faint); }
.pull-foot { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pull-count { font-size: 13px; color: var(--ink-soft); }

.ref-actions { display: flex; gap: 10px; margin-top: 4px; }

  /* ------------------------------------------------------------------

  /* ==================================================================

  function statusLabel(s) {

  }

  function changeTable(rows, h1, h2, kept) {

      rows.map(function (m) { return '<tr><td class="mono was">' + esc(m.find != null ? m.find : m.heard) + '</td><td class="mono now">' + esc(m.replace != null ? m.replace : m.likely) + '</td>' + (why ? '<td>' + esc(m.note || '') + '</td>' : '') + '</tr>'; }).join('') +

  function renderSectionDetails(s, blocks) {

  function renderOverview() {

  function statusSummary() {

    var finals = state.sections.filter(isFinal).length;

  /* ---- Repainting: keep the caret where it was; repaint one card when that is all that changed ---- */

  function captureFocus() {
    var el = document.activeElement;
    if (!el || !el.dataset) return null;
    var pos = { start: el.selectionStart, end: el.selectionEnd, scrollTop: el.scrollTop };
    if (el.dataset.field) { pos.selector = '[data-field="' + el.dataset.field + '"]' + (el.dataset.id ? '[data-id="' + el.dataset.id + '"]' : ':not([data-id])'); return pos; }
    if (el.dataset.wfield) { pos.selector = '[data-wfield="' + el.dataset.wfield + '"]'; return pos; }
    if (el.hasAttribute('data-ref-input')) { pos.selector = '[data-ref-input]'; return pos; }
    return null;
  }
  function restoreFocus(f) {
    if (!f) return;
    var el = root.querySelector(f.selector);
    if (!el) return;
    try { el.focus({ preventScroll: true }); if (f.start != null && el.setSelectionRange) el.setSelectionRange(f.start, f.end); el.scrollTop = f.scrollTop; } catch (e) {}
  }
  function paint() { var f = captureFocus(); root.innerHTML = renderApp(); restoreFocus(f); }
  function paintSection(id) {
    var s = findSection(id), el = root.querySelector('[data-section="' + id + '"]');
    if (!s || !el) { paint(); return; }
    var f = captureFocus(); el.outerHTML = renderSectionSafe(s); restoreFocus(f);
    paintScriptSummary();                              // one card changing can change the book's count of written scripts
  }
  function paintStatus() {

    paintScriptSummary();

  }
  function paintChipOnly(s) {

      if (clock) { chip.setAttribute('data-ts', clock.ts); chip.setAttribute('data-prefix', clock.prefix); } else { chip.removeAttribute('data-ts'); chip.removeAttribute('data-prefix'); }

  /* ==================================================================
     Capabilities
     ================================================================== */

  var capCache = {};
  function useCap(name) {
    if (capCache[name]) return capCache[name];
    if (!window.claude || typeof window.claude.use !== 'function') { capCache[name] = Promise.resolve(null); return capCache[name]; }
    capCache[name] = window.claude.use(name).catch(function () { return null; });
    return capCache[name];
  }

  /* ==================================================================
     Saving — the artifact's document store, shared by the whole team.

       books/<book>                    title, word list, guide order, counts
       books/<book>/scripts/<guide>    one audio guide: its transcripts, changes and sign-off
       books/<book>/captions/<guide>   that guide's timed captions
       written/<id>                    one written script's title and fingerprint   (15-written-scripts.js)
       writtenText/<id>                that written script's text

     The path says "scripts" because that is what a guide was called when the
     store was laid out. It is kept: renaming it would strand every saved book.

     Every book is its own workbench. Opening, clearing or deleting one
     never touches another.

     The prototypes kept a single workbench at state/meta, scripts/<id>
     and captions/<id>. The first time this version loads, that work is
     copied into a first book and the originals are left where they
     were (SOURCE-OF-TRUTH 4.5: previous work is never thrown away).

     Nothing is written until the open book has finished loading, so a
     half-loaded page can never overwrite or duplicate anything.
     ================================================================== */

  var dbRoot = null;           // the store itself, once it can be reached
  var dbApi = null;            // the store, but only while a book is open and loaded — the gate for every write to it
  var dbStatus = 'loading';    // loading | ready | unavailable
  var view = 'library';        // library | book | written | glossary
  var bookId = null;           // the open book
  var library = [];            // [{ id, title, scripts, edited, finals, at }], most recently worked on first
  var deletingBook = null;
  var saveError = null;
  var pendingSaves = {};
  var pendingCaptionSaves = {};
  var metaTimer = null;
  var savesInFlight = 0;
  var everSaved = false;
  var FIRST_BOOK = 'first';    // where the prototypes' single workbench is copied to — a fixed name, so copying twice is harmless

  function bookRef(book) { return dbRoot.doc('books/' + book); }
  function scriptRef(book, id) { return dbRoot.doc('books/' + book + '/scripts/' + id); }
  function captionRef(book, id) { return dbRoot.doc('books/' + book + '/captions/' + id); }
  // Read a whole collection. The size is asked for outright (1,000 is the most one read may return) rather than
  // left to a default, so a long book cannot come back partly loaded.
  function readAll(path) { return dbRoot.collection(path).limit(1000).get(); }
  function newBookId() { return 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function sectionToDoc(s) {
    return { name: s.name || '', raw: s.raw || '', corrected: s.corrected || '',
             editedFromRaw: s.editedFromRaw == null ? '' : s.editedFromRaw, hasEditedFrom: s.editedFromRaw != null,
             summary: s.summary || '', changeCount: s.changeCount || 0, misheard: s.misheard || [], nonsensical: s.nonsensical || [],
             edits: s.edits || [], unapplied: s.unapplied || [], verses: s.verses || [], method: s.method || '',
             status: s.status || 'draft', error: s.error || '', editedAt: s.editedAt || 0, descriptId: s.descriptId || '', descriptName: s.descriptName || '',
             suggested: s.suggested || [], misquotes: s.misquotes || [],
             approvedAt: Number(s.approvedAt) || 0, writtenId: s.writtenId || '',
             writtenUsed: s.writtenUsed ? { id: String(s.writtenUsed.id || ''), title: String(s.writtenUsed.title || '') } : null };
  }
  // What comes back from the store was written by this page, an older version of it, or anyone with access using

  /* ---- One write at a time per document ----
     The store asks for it, and it matters: two saves of the same guide sent close together can arrive in either

  var writeSlots = {};

  function saveCaptionsSoon(id) {

  function dbErrorMessage(err) {

    if (code === 'quota_exceeded') return 'The Scriptorium’s storage is full, so this was not saved. It is still on screen. Delete a book or written scripts that are no longer needed, then change something here to save again.';
    if (code === 'resource_exhausted') return 'Saving is being throttled — it will catch up in a moment.';

  function applyStored(meta, byId, captionsById) {

          ids.forEach(function (id) { chain = chain.then(function () { return scriptRef(FIRST_BOOK, id).set(JSON.parse(JSON.stringify(scripts[id] || {}))); }); });
          Object.keys(caps).forEach(function (id) { chain = chain.then(function () { return captionRef(FIRST_BOOK, id).set(JSON.parse(JSON.stringify(caps[id] || {}))); }); });

  function loadCollapsed(book) {

  }

    return Promise.all([bookRef(id).get(), readAll(base + '/scripts'), readAll(base + '/captions').catch(noDocs)]).then(function (res) {

  function initStore() {

  /* ==================================================================

  function addSection() {

  }

  function copyCorrected(id, btn) {

  }

  /* ---- Correcting an Edited Transcript by hand ---- */

  function hasHandWork(s) { return s.handDraft != null || (s.edits || []).some(function (e) { return e.kind === 'hand'; }); }

  function startHandEdit(id) {
    syncFieldsFromDom();

    if (!s || !s.corrected || s.status === 'editing') return;
    s.handDraft = s.corrected;
    paintSection(id);

  }
  function cancelHandEdit(id) { var s = findSection(id); if (s) { delete s.handDraft; paintSection(id); } }

  // Keep the change, and list it: every run of words that differs becomes a row under "Changed by hand".
  function saveHandEdit(id) {
    syncFieldsFromDom();
    var s = findSection(id);
    if (!s || s.handDraft == null) return;
    var text = trimLineEnds(tameSpaces(s.handDraft).replace(/\r\n?/g, '\n')).replace(/\n{3,}/g, '\n\n').trim();
    if (!text) { showFlash('The transcript can’t be left empty. Cancel to keep it as it was.'); return; }

  // Redoing the edit pass replaces the Edited Transcript, hand corrections included — so ask first (4.5).
  function askRedo(id) {
    var s = findSection(id);
    if (!s) return;
    if (!hasHandWork(s)) { redoSection(id); return; }

      title: 'Redo “' + (s.name || 'this guide') + '”?',
      body: 'This guide has corrections made by hand. Redoing the edit pass replaces the Edited Transcript with a fresh result, and those corrections are lost.',
      warn: '',
      confirmLabel: 'Redo and replace',
      onConfirm: function () { confirmState = null; delete s.handDraft; redoSection(id); }

  }

  /* ---- Signing off: an Edited Transcript a person has reviewed becomes the Final Transcript ---- */

  // Asks first when something on the card is still open, so a sign-off is never given past a warning unseen.
  function approveSection(id, sure) {
    syncFieldsFromDom();

    if (!s || s.status !== 'edited' || !s.corrected) return;
    if (s.handDraft != null) { showFlash('Save or cancel the corrections you are making by hand first.'); return; }

  }
  function unapproveSection(id) {
    var s = findSection(id);

    paint();
    saveSection(id).then(saveMeta);
  }
  /* ------------------------------------------------------------------
     One prompt, sent once per script. Every character here is paid for on
     every call, so it says each rule once and nothing the page already
     does itself: cues, spacing, quote marks, ellipses, missing full stops,
     sentence-start capitals, "I", God/Lord, Bible books and listed names
     are all fixed locally before the text is sent (see mechanics,
     fixNames and fixCapitals).
     ------------------------------------------------------------------ */

  // `gloss` is what the glossary adds for this guide (glossaryFor): names from its book of the Bible, and the
  // approved mishearings whose words occur in this transcript. A guide neither bears on adds nothing (4.6, 4.12).
  function promptHeader(section, hasWritten, gloss) {
    var names = [String(state.wordsToSearchFor || '').trim()].concat((gloss && gloss.names) || []).filter(Boolean).join(', ');
    var hints = ((gloss && gloss.hints) || []).map(function (h) { return '"' + h.heard + '" = ' + h.term; }).join('; ');
    return 'Proofread this Descript AI transcript of a spoken audio guide. Descript captures the SOUND of words, not always the right words — unfamiliar names often come through as an ordinary phrase that sounds similar.\n\n' +
      'Book or plan: ' + (state.bookTitle || '(untitled)') + '\n' +
      'Script name: ' + (section.name || '(untitled section)') + '\n' +
      'Names or terms the speaker uses that may be misheard: ' + (names || '(none listed)') + '\n' +
      (hints ? 'Mishearings found in earlier guides (apply one only where this sentence means that term): ' + hints + '\n' : '') + '\n' +
      'Fix the following WITHOUT changing the speaker’s wording, meaning, tone, or intent:\n' +
      '1. GRAMMAR AND PUNCTUATION — the main job.\n' +
      '- Every question ends with a question mark, including rhetorical ones mid-flow ("Or was it a Big Bang?"); transcription flattens these to periods.\n' +
      '- Commas for direct address ("Welcome back, my friends"), introductory and interrupting phrases, and lists (serial comma).\n' +
      '- Statements end with periods; a full sentence in parentheses keeps its period inside. "?!" is fine for an exclaimed question.\n' +
      '- Hyphenate compound modifiers before a noun ("so-called", "well-meaning").\n' +
      '- CAPITALIZATION: names, places, and titles, consistently; ordinary nouns stay lowercase ("my dad", "the church").\n' +
      '- Keep deliberate fragments and the casual voice ("No soapbox." "Then, 1964."). Never merge or complete them.\n' +
      '- RUN-ONS: where a sentence chains past two or three clauses on "and", "so", "but", "because", break it with punctuation and capitalization only — never new words: end at a natural boundary and start the next sentence with the conjunction, use a semicolon between closely linked statements, or set off an aside with an em dash (—). Keep the words in their order.\n' +
      '- Keep the dashes already there; add one only where it does grammatical work, never just for a pause.\n' +
      '- Remove a line that is only a section label in capitals (e.g. BEARINGS). Words spoken in capitals for emphasis stay.\n' +
      '- Bible references in digits, never number words or a mix ("Isaiah 35:1", "chapter 12", "verse 3"); keep the words "chapter" and "verse" where spoken. Other numbers stay as spoken.\n' +
      '2. MISHEARD WORDS: plausible mishearings of a listed name or term ("Eli who" for Elihu, "so far" for Zophar), and other names where the sentence only makes sense with a different word. A correction must SOUND like what was transcribed — never swap in a different word that means the same.\n' +
      '3. SCRIPTURE: the speaker quotes Bible verses, usually after a reference ("Verse one", "Job 2:4", "Isaiah 3 verses two through four"). Inside a quoted verse fix ONLY misheard words ("the land of us" to "the land of Uz"); change nothing else — not wording, order, capitalization, or punctuation, even where it looks wrong. Translations read oddly on purpose. The speaker quotes the NIV, sometimes the ESV: never change a quotation to match a verse. If one matches neither translation in meaning or a key word, leave it and report it under "misquotes".\n' +
      '4. Flag any sentence that still makes no sense after your edits, with your best guess at what is wrong.\n' +
      // SOURCE-OF-TRUTH 4.9. Sent only for a guide that has a written script, so no other call pays for it (4.6).
      (hasWritten ? '5. WRITTEN SCRIPT: what the teacher wrote before recording is given below as a reference. The teacher did not read it out word for word, so NEVER change the transcript to match it. ' +
        'Use it only as evidence for a fix rules 1 to 3 already allow: a misheard word or name, a question mark where a question was meant, a comma, where a sentence or a quotation ends. Add "source":"script" to an edit it supports. ' +
        'Where the transcript looks wrong against it in another way — a word dropped or misheard as a different-sounding word, NOT the speaker rewording — still give the edit, with "source":"script"; the page lists it as a suggestion and leaves the transcript as spoken.\n' : '') +
      '\n';
  }

  // Verses come back as short anchors, not the whole quotation: the page finds the span between
  // them in the corrected text itself (layoutBlocks), so Claude is never paid to re-type a verse.
  function versesSpec() {
    return '"verses": every Bible quotation, in order. Each: "reference" — the reference phrase as spoken nearby, copied from the text ("Verse one", "Job 2:4"), or "" if none; ' +
      '"startsWith" — the first 4 to 6 words of the quoted verse as it reads after your edits, copied exactly, without the opening quotation mark; "endsWith" — its last 4 to 6 words, likewise; ' +
      '"canonical" — Book Chapter:Verse, or Chapter:Verse-Verse for a span ("Luke 1:30-33"), worked out from the book this script covers, the spoken reference, and the quoted words (count the verses it runs through); ' +
      '"confidence" — "high" only when sure of the canonical reference, else "low"; "note" — "" when confident, else a few words on the doubt.\n' +
      'A quotation is the whole verse as it appears in the Bible, including narration inside it ("How will this be," Mary asked, "since I am a virgin?"), never the speaker’s commentary. In the corrected text each quoted verse is wrapped in double quotation marks; speech inside a verse uses single quotation marks.\n';
  }
  function joinsSpec() {
    if (!repairParagraphs) return '';

  var WRITTEN_PROMPT_MAX = 60000;      // characters of a written script sent with its guide

    return promptHeader(section, !!written, gloss) +

      versesSpec() +
      joinsSpec() +
      '"misquotes": quotations that match neither the NIV nor the ESV. Each: "said" — the speaker’s words, copied; "verse" — how the verse reads; "reference".\n' +
      '"nonsensical": sentences that still make no sense after your edits. "summary": one or two plain sentences on what you corrected.\n\n' +
      'Return ONLY this JSON object:\n' +
      '{"edits":[{"find":"","replace":""}],"verses":[{"reference":"","startsWith":"","endsWith":"","canonical":"","confidence":"high","note":""}],' + (repairParagraphs ? '"joins":[{"endsWith":"","startsWith":""}],' : '') + '"misquotes":[{"said":"","verse":"","reference":""}],"nonsensical":[{"original":"","issue":""}],"summary":""}\n' +

      (written ? 'WRITTEN SCRIPT (reference only — never copy its wording into the transcript):\n"""\n' + written + '\n"""\n\n' : '') +

  function sampleErrorMessage(err) {
    var code = err && err.code;
    if (code === 'not_granted') return 'permission to use Claude was declined';
    if (code === 'rate_limited') return 'too many requests right now — try again shortly';
    if (code === 'prompt_too_large') return 'this transcript is too long for one pass — try splitting it into two guides';
    if (code === 'invalid_json') return 'the response could not be read — try again';
    if (code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') return 'editing isn’t available in this view';
    if (code === 'refused' || code === 'empty_completion') return 'Claude could not produce a result for this one — try again';
    return (err && err.message) || 'something went wrong';
  }

  /* ------------------------------------------------------------------
     Local mechanics — everything with a deterministic answer is done here,
     free, BEFORE the text is sent, so Claude is never paid to find it or to
     return it. Judgment calls (run-ons, comma splices, misheard words,
     scripture) stay with the editor. Each pass records what it did so the
     change table stays complete (SSOT 4.4).

    [/[ \t]+([,;:!?…]|\.(?!\d))/g, '$1'],       // no space before punctuation — but "about .5" keeps its space

  function mechanics(text, intoEdits) {

  // Before the edit pass (`beforeEdit`) a paragraph that follows one with no closing punctuation is left as it is:

  // middle of a sentence once the break is closed up. After the joins every paragraph start is done.
  function fixCapitals(text, intoEdits, beforeEdit) {

  /* ------------------------------------------------------------------

     on either side of a reference colon. Whether "verse one" or "Peter

  /* ------------------------------------------------------------------
     The wording guard — SOURCE-OF-TRUTH 4.1 and 4.2, enforced here and
     not left to the edit pass.

     An edit the editor proposes is applied only if every word it touches
     either stays the same word (punctuation, capitals, spacing, hyphens
     and number notation may change), or is replaced by words that sound
     the same — which is what a mishearing is. A section label standing
     alone on a line may be removed. Anything else would change
     what the speaker said. It is held back and shown as a suggestion.
     ------------------------------------------------------------------ */

  // Where one number stops and the next starts is part of what was said, so it is kept: "3:16" and "31:6" are
  // different, while "35 1" and "35:1" are the same, and so are "1,000" and "1000". Letters of every alphabet count.

       2. the same sound once spelling is folded                   Eli who / Elihu, so far / Zophar, us / Uz

       4. a name the reader listed under Words to Search For,
          roughly                                                  never can nezzar / Nebuchadnezzar

  var HOMOPHONE_GROUP = {};

   'rain reign rein|alter altar|profit prophet|lead led|passed past|threw through|wear where ware|weather whether|which witch|would wood|' +
   'aloud allowed|break brake|die dye|fair fare|great grate|hi high|made maid|meat meet|not knot|or ore oar|plain plane|principal principle|' +
   'role roll|sail sale|scene seen|steal steel|tail tale|throne thrown|vain vein|waist waste|mourning morning|night knight|raise rays|' +

  // The book's own Words to Search For, as letters only.

  // Every name the wording check counts as listed: the book's own, and the terms a person approved for the glossary (4.12).

  // Sets e.kind to 'misheard' when it swaps sound-alike words unlabelled, so the swap is shown where a reader looks for it.

  // Runs `concurrency` guides at once (1 or 2). Each finished guide is saved on its own

  function editAll(force) {
    syncFieldsFromDom();
    if (dbStatus === 'loading') { showFlash('Still loading your saved guides — give it a second and try again.'); return; }
    useCap('sample').then(function (sample) {
      if (!sample) { showFlash('This page needs permission to use Claude for editing. Open it in a Claude viewer that allows that, then try again.'); return; }
      var toProcess = state.sections.filter(needsEdit);
      var byHand = toProcess.filter(hasHandWork).length;

          body: byHand + ' of the guides about to be edited ' + (byHand === 1 ? 'has' : 'have') + ' corrections made by hand. Their transcript has changed, so the edit pass will replace the Edited Transcript, and those corrections are lost.',
          warn: '', confirmLabel: 'Edit and replace',

  function stopEdit() { editControllers.forEach(function (c) { try { c.abort(); } catch (e) {} }); }

  /* ---- Clearing the workbench for the next book ---- */

  /* ---- Building the Google Doc ----

  function docTitle() { return (state.bookTitle.trim() || 'Untitled') + ' — Audio Guide Transcripts'; }

  // In one Doc for the whole book, every guide after the first starts on a page of its own.

  // The two Google tools this page writes with: Drive makes a file, Docs writes into one this page has just made (4.11).

      '<summary>Timed captions for search' + (has ? '' : ' <span class="caption-optional">— optional</span>') + '</summary>' +
      '<p class="hint"><strong>Pull from Descript</strong> fills this in for you. By hand: in Descript, export this audio guide’s subtitles as <strong>.srt</strong>, open the file, and paste everything in it here. The Scriptorium puts the corrected transcript onto those timings and gives you an .srt and a .vtt.</p>' +
      (s.descriptName ? '<p class="hint">Pulled from the Descript project <span class="caption-source">' + esc(s.descriptName) + '</span>.</p>' : '') +
      '<textarea data-field="captions" data-id="' + s.id + '" rows="5" placeholder="1&#10;00:00:00,000 --> 00:00:03,200&#10;welcome back my friends">' + esc(s.captions || '') + '</textarea>' +
      '<div class="caption-bar"><p class="caption-note' + (note.warn ? ' is-warn' : '') + '">' + esc(note.text) + '</p>' +
      '<button type="button" class="copy-btn" data-action="download-captions" data-id="' + s.id + '"' + (captionsReady(s) ? '' : ' disabled') + '>Download .srt + .vtt</button></div>' +
      '</details>';
  }
  // Refresh the sentence and the button in place, so typing in the box never loses the caret.
  function paintCaptionNote(s) {
    var fold = root.querySelector('[data-caption-fold="' + s.id + '"]');
    if (!fold) return;
    var note = captionNote(s), p = fold.querySelector('.caption-note'), btn = fold.querySelector('[data-action="download-captions"]');
    if (p) { p.textContent = note.text; p.classList.toggle('is-warn', note.warn); }
    if (btn) btn.disabled = !captionsReady(s);
  }

  function fileSafe(name, fallback) {
    return String(name || '').replace(/[\\/:*?"<>|\u0000-\u001F]+/g, ' ').replace(/\s+/g, ' ').replace(/^[ .]+|[ .]+$/g, '') || fallback;
  }
  // The caption files for each guide that has captions ready, with names that cannot collide. `format` is 'srt',
  // 'vtt' or 'both'. With both kinds in a book's download, each kind gets a folder of its own.
  function captionFiles(sections, nested, format) {
    format = captionFormatOf(format);
    var files = [], used = {}, folders = nested && format === 'both';
    sections.forEach(function (s) {
      if (!captionsReady(s)) return;
      var base = fileSafe(s.name, 'Guide ' + (state.sections.indexOf(s) + 1)), name = base, n = 2;
      while (used[name.toLowerCase()]) { name = base + ' (' + n + ')'; n += 1; }
      used[name.toLowerCase()] = true;
      var cues = captionResult(s).cues;
      if (format !== 'vtt') files.push({ name: (folders ? 'srt/' : '') + name + '.srt', text: toSrt(cues) });
      if (format !== 'srt') files.push({ name: (folders ? 'vtt/' : '') + name + '.vtt', text: toVtt(cues) });
    });
    return files;
  }
  function captionKinds(format) { return format === 'srt' ? 'an .srt each' : format === 'vtt' ? 'a .vtt each' : 'an .srt and a .vtt each'; }
  function saveCaptionZip(sections, zipName, nested, format) {
    syncFieldsFromDom();
    format = captionFormatOf(format);
    var files = captionFiles(sections, nested, format), guides = files.length / (format === 'both' ? 2 : 1);
    if (!files.length) { showFlash('No caption files are ready yet. A guide needs its timed captions and the edit pass run.'); return Promise.resolve(); }
    return useCap('downloads').then(function (downloads) {
      if (!downloads) { showFlash('Downloads aren’t available in this view, so caption files can’t be saved from here.'); return; }
      return downloads.save({ filename: zipName, data: zipFiles(files) }).then(function () {
        var left = sections.length - guides;
        showFlash('Saved ' + guides + ' audio guide' + plural(guides) + ' as caption files — ' + captionKinds(format) + ', inside ' + zipName + '.' +
          (nested && left > 0 ? ' ' + left + ' guide' + plural(left) + ' had no caption files ready and ' + (left === 1 ? 'was' : 'were') + ' left out.' : ''));
      }, function (err) {
        var code = err && err.code;
        if (code === 'declined') return;
        if (code === 'rejected_extension' || code === 'extension_not_enabled') showFlash('This view doesn’t allow .zip downloads, so caption files can’t be saved from here.');
        else showFlash('Couldn’t save the caption files: ' + ((err && err.message) || 'unknown error'));
      });
    });
  }
  function downloadCaptions(id) {
    var s = findSection(id);
    if (s) saveCaptionZip([s], fileSafe(s.name, 'guide') + ' captions.zip', false);
  }
  // The whole book in one download, in the kind of file the reader picked at the bottom of the page.
  function captionsReadyCount() { return state.sections.filter(captionsReady).length; }
  function downloadAllCaptions() {
    saveCaptionZip(state.sections, fileSafe(state.bookTitle, 'audio guide') + ' captions' + (captionFormat === 'both' ? '' : ' (' + captionFormat + ')') + '.zip', true, captionFormat);
  }
  /* ==================================================================
     Descript — read, never written (SOURCE-OF-TRUTH 4.8)

     Uses the viewer's own Descript connector, and only three of its
     tools, all of them reads:

       list_folders       the folders in the Drive
       list_projects      the projects in one folder — in the TTW Drive,
                          one project is one audio guide
       export_transcript  a project's transcript, once as plain text
                          (the raw transcript) and once as .srt (the
                          timed captions)

     Each audio guide pulled becomes a script in the open book. Pulling
     the same one again updates that script rather than adding a second.
     Nothing here calls Claude, so pulling costs no usage (4.6).
     ================================================================== */

  var DESCRIPT_GAP_MS = 6500;    // Descript allows ten exports a minute, and each audio guide takes two
  var DESCRIPT_PAGES = 10;       // up to 1,000 projects listed per folder
  var DESCRIPT_SCAN_PAGES = 20;  // up to 2,000 projects looked through for ones that are in no folder
  var pull = null;               // the Pull from Descript panel, while it is open
  var lastExportAt = 0;

  // "Isaiah_2" before "Isaiah_10".
  function naturalCompare(a, b) { return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' }); }

  // The words a tool sent back, exactly as sent — a transcript is text, and must not be read as JSON.
  function toolText(res) {
    var blocks = (res && Array.isArray(res.content)) ? res.content : [];
    var text = blocks.filter(function (b) { return b && b.type === 'text' && typeof b.text === 'string'; }).map(function (b) { return b.text; }).join('');
    if (!text && res && typeof res.payload === 'string') text = res.payload;
    return text;
  }
  // The JSON answer of a listing call, or {} when there is none.
  function toolData(res) {
    var p = res && res.payload;
    if (!p || typeof p !== 'object') { try { p = JSON.parse(toolText(res)); } catch (e) { p = null; } }
    return (p && typeof p === 'object') ? p : {};
  }

  // One plain sentence per kind of failure, each with the thing that fixes it.
  function descriptProblem(err) {
    var code = err && err.code;
    if (code === 'needs_reauth') return 'Descript needs reconnecting. In Claude, open Settings → Connectors, reconnect Descript, then try again.';
    if (code === 'server_not_connected' || code === 'server_not_found' || code === 'selection_required') return 'Descript isn’t connected for you yet. In Claude, open Settings → Connectors, add Descript, then try again.';
    if (code === 'not_in_manifest' || code === 'approval_required' || code === 'consent_required') return 'This page wasn’t allowed to use Descript. Reload the page and choose Allow when it asks.';
    if (code === 'blocked_by_policy') return 'Your organization doesn’t allow this page to use Descript.';
    if (code === 'server_unavailable' || code === 'rate_limited') return 'Descript didn’t answer just now. Wait a minute and try again.';
    if (code === 'not_granted' || code === 'capability_disabled' || code === 'capability_removed') return 'Descript can’t be reached in this view. Open the Scriptorium inside Claude and try again.';
    if (code === 'tool_error') return 'Descript reported a problem: ' + ((err && err.message) || 'no details given') + '.';
    return 'Couldn’t reach Descript: ' + ((err && err.message) || 'unknown error') + '.';
  }
  // A failure that every remaining audio guide would hit the same way.
  function isAccessProblem(err) {
    return !!(err && /^(needs_reauth|server_not_connected|server_not_found|selection_required|not_in_manifest|blocked_by_policy|approval_required|consent_required|not_granted|capability_disabled|capability_removed)$/.test(err.code));
  }

  function descriptConnect() {
    return useCap('mcp').then(function (mcp) {
      if (!mcp) throw { code: 'capability_disabled' };
      return mcp.listTools().then(function (list) {
        var sv = ((list && list.servers) || []).filter(function (x) { return /^descript$/i.test(String((x && x.server) || '').trim()); })[0];
        if (!sv) throw { code: 'server_not_connected' };
        if (sv.authStatus === 'needs_reauth') throw { code: 'needs_reauth' };
        return { mcp: mcp, server: sv.server };
      });
    });
  }

  // The projects in one folder — or, with `unfiled`, the projects that are in no folder at all. Descript can only
  // list a folder or the whole Drive, so the second is the whole Drive with everything foldered left out.
  // Resolves { list, more }: `more` is true when Descript had further pages than were read.
  function listAllProjects(conn, path, unfiled) {
    var all = [];
    function page(cursor, pagesLeft) {
      var input = { limit: 100, sort: 'name', direction: 'asc' };
      if (!unfiled) input.folder_path = path;
      if (cursor) input.cursor = cursor;
      return conn.mcp.callTool(conn.server, 'list_projects', input).then(function (res) {
        var d = toolData(res);
        (Array.isArray(d.data) ? d.data : []).forEach(function (p) {
          if (p && p.id && !(unfiled && String(p.folder_path || '').trim())) all.push({ id: String(p.id), name: String(p.name || 'Untitled'), updated: Date.parse(p.updated_at) || 0 });
        });
        var next = d.pagination && d.pagination.next_cursor;
        if (next && pagesLeft > 1) return page(next, pagesLeft - 1);
        return { list: all.sort(function (x, y) { return naturalCompare(x.name, y.name); }), more: !!next };
      });
    }
    return page(null, unfiled ? DESCRIPT_SCAN_PAGES : DESCRIPT_PAGES);
  }

  /* ---- Browsing the Drive ---- */

  function openPull() {
    syncFieldsFromDom();
    pull = { step: 'browse', path: '', folders: [], projects: [], selected: {}, loading: true, error: null, conn: null, token: 0 };
    pullOpenFolder('');
  }
  function closePull() { if (pull && pull.step === 'pulling') return; pull = null; paint(); }

  function pullOpenFolder(path, unfiled) {
    if (!pull || pull.step === 'pulling') return;
    pull.step = 'browse'; pull.path = path; pull.unfiled = !!unfiled; pull.more = false; pull.loading = true; pull.error = null; pull.folders = []; pull.projects = []; pull.selected = {};
    var token = pull.token = pull.token + 1;
    paint();
    var ready = pull.conn ? Promise.resolve(pull.conn) : descriptConnect().then(function (conn) { if (pull) pull.conn = conn; return conn; });
    ready.then(function (conn) {
      return Promise.all([
        unfiled ? null : conn.mcp.callTool(conn.server, 'list_folders', path ? { parent_path: path } : {}),
        (path || unfiled) ? listAllProjects(conn, path, unfiled) : { list: [], more: false }
      ]);
    }).then(function (res) {
      if (!pull || pull.token !== token) return;          // the reader has already opened another folder
      var folders = toolData(res[0]).data;
      pull.folders = (Array.isArray(folders) ? folders : []).map(function (f) { return String((f && f.path) || ''); }).filter(function (p) { return p.trim(); }).sort(naturalCompare);
      pull.projects = res[1].list; pull.more = res[1].more;
      pull.loading = false; paint();
    }).catch(function (err) {
      if (!pull || pull.token !== token) return;
      console.warn('Scriptorium: Descript listing failed', err);
      pull.loading = false; pull.error = descriptProblem(err); paint();
    });
  }

  function pullSelectedCount() { return pull ? pull.projects.filter(function (p) { return pull.selected[p.id]; }).length : 0; }
  // Refresh the button and the time estimate in place, so ticking a box never moves the page.
  function paintPullCount() {
    var btn = root.querySelector('[data-action="pull-start"]'), note = root.querySelector('.pull-count'), all = root.querySelector('[data-action="pull-all"]');
    var n = pullSelectedCount();
    if (btn) { btn.disabled = !n; btn.textContent = n ? 'Pull ' + n + ' audio guide' + plural(n) : 'Pull selected'; }
    if (note) { var mins = Math.max(1, Math.ceil(n * 2 * DESCRIPT_GAP_MS / 60000)); note.textContent = n ? 'About ' + mins + ' minute' + plural(mins) + '.' : ''; }
    if (all && pull) all.checked = !!n && n === pull.projects.length;
  }
  function pullPick(id, checked) { if (!pull) return; if (checked) pull.selected[id] = true; else delete pull.selected[id]; paintPullCount(); }
  function pullPickAll(checked) {
    if (!pull) return;
    pull.selected = {};
    if (checked) pull.projects.forEach(function (p) { pull.selected[p.id] = true; });
    root.querySelectorAll('[data-action="pull-pick"]').forEach(function (box) { box.checked = !!checked; });
    paintPullCount();
  }

  /* ---- Pulling ---- */

  function delay(ms) { return new Promise(function (resolve) { setTimeout(resolve, ms); }); }
  function exportOnce(conn, id, format) {
    return delay(Math.max(0, lastExportAt + DESCRIPT_GAP_MS - Date.now())).then(function () {
      lastExportAt = Date.now();
      return conn.mcp.callTool(conn.server, 'export_transcript', { project_id: id, format: format, include_speaker_labels: 'off' }, { cache: false });
    }).then(toolText);
  }
  // One more try, and only for a failure that waiting can fix. An export is a read, so repeating it is safe.
  function exportPaced(conn, id, format) {
    return exportOnce(conn, id, format).catch(function (err) {
      if (!(err && (err.retryable || err.code === 'server_unavailable' || err.code === 'rate_limited'))) throw err;
      return delay(Math.min(Number(err.retryAfterMs) || 20000, 60000)).then(function () { return exportOnce(conn, id, format); });
    });
  }

  // Put one audio guide into the open book: its own card if it has one already, else an empty card, else a new one.
  function placeFromDescript(project, text, srt) {
    syncFieldsFromDom();
    var s = state.sections.filter(function (x) { return x.descriptId === project.id; })[0], isNew = !s;
    if (!s) {
      s = state.sections.filter(function (x) { return !x.descriptId && !x.raw.trim() && !x.name.trim() && !(x.captions || '').trim(); })[0];
      if (!s) { s = newSection(); state.sections.push(s); }
      // Two versions of one chapter would otherwise share a name. The later arrival says which it is.
      var base = scriptNameFromDescript(project.name), name = base, variant = descriptVariant(project.name);
      var taken = function (n) { return state.sections.some(function (x) { return x !== s && x.name === n; }); };
      if (taken(name) && variant && base !== project.name) name = base + ' (' + variant + ')';
      for (var copy = 2; taken(name); copy++) name = base + ' (' + copy + ')';
      s.name = name; s.descriptId = project.id;
    }
    s.descriptName = project.name;
    s.raw = String(text).trimEnd();
    s.captions = String(srt || '').trimEnd();
    touchBook();
    return saveSection(s.id).then(function () { return saveCaptions(s.id); }).then(function () { return saveMeta(); }).then(function () { return isNew; });
  }

  function pullStart() {
    if (!pull || pull.step !== 'browse' || !pull.conn) return;
    var queue = pull.projects.filter(function (p) { return pull.selected[p.id]; });
    if (!queue.length) return;
    var book = bookId, conn = pull.conn, run = pull;
    syncFieldsFromDom();
    if (!String(state.bookTitle || '').trim() && run.path) state.bookTitle = bookTitleFromFolder(run.path);   // an untitled book takes the folder's name
    run.step = 'pulling'; run.total = queue.length; run.done = 0; run.added = 0; run.updated = 0; run.failed = []; run.stop = false; run.current = '';
    paint();
    function next() {
      var p = queue.shift();
      if (!p || run.stop || pull !== run || bookId !== book) return Promise.resolve();
      run.current = p.name; paintPull();
      return exportPaced(conn, p.id, 'txt').then(function (text) {
        if (!String(text || '').trim()) throw { code: 'empty' };
        return exportPaced(conn, p.id, 'srt').then(function (srt) { return placeFromDescript(p, text, srt); });
      }).then(function (isNew) {
        if (isNew) run.added += 1; else run.updated += 1;
      }, function (err) {
        console.warn('Scriptorium: Descript pull failed for ' + p.name, err);
        run.failed.push({ name: p.name, why: (err && err.code === 'empty') ? 'Descript has no transcript for it.' : descriptProblem(err) });
        if (isAccessProblem(err)) run.stop = true;          // the rest would fail the same way
      }).then(function () { run.done += 1; paint(); return next(); });
    }
    next().then(function () { if (pull === run) { run.step = 'done'; run.current = ''; paint(); } });
  }
  function pullStop() { if (pull && pull.step === 'pulling') { pull.stop = true; paintPull(); } }

  /* ---- The panel ---- */

  function paintPull() {
    var el = root.querySelector('.pull-panel');
    if (el && pull) el.outerHTML = renderPull(); else paint();
  }

  function renderPull() {
    if (!pull) return '';
    var head = '<div class="pull-head"><h3>Pull from Descript</h3>' + (pull.step === 'pulling' ? '' : '<button type="button" class="link-btn" data-action="pull-close">Close</button>') + '</div>';

    if (pull.step === 'pulling') {
      return '<section class="pull-panel">' + head +
        '<p class="pull-progress">' + esc(pull.stop ? 'Stopping after this one…' : 'Pulling ' + Math.min(pull.done + 1, pull.total) + ' of ' + pull.total + (pull.current ? ' — ' + pull.current : '') + '…') + '</p>' +
        '<p class="hint">Descript lets a page pull about five audio guides a minute. Keep this page open until it finishes; each one is saved as it arrives.</p>' +
        '<div class="pull-foot"><button type="button" class="btn btn-ghost" data-action="pull-stop"' + (pull.stop ? ' disabled' : '') + '>Stop</button></div>' +
        '</section>';
    }

    if (pull.step === 'done') {
      var got = pull.added + pull.updated, left = pull.total - pull.done;
      var line = got ? 'Pulled ' + got + ' audio guide' + plural(got) + ' from Descript' + (pull.updated ? ' — ' + pull.added + ' new, ' + pull.updated + ' updated' : '') + '.' : 'Nothing was pulled.';
      if (left > 0) line += ' Stopped with ' + left + ' still to go.';
      return '<section class="pull-panel">' + head +
        '<p class="pull-progress">' + esc(line) + '</p>' +
        (pull.failed.length ? '<ul class="pull-failed">' + pull.failed.map(function (f) { return '<li><strong>' + esc(f.name) + '</strong> — ' + esc(f.why) + '</li>'; }).join('') + '</ul>' : '') +
        (got ? '<p class="hint">Next: check the guide names, list any names Descript tends to mishear under Words to Search For, then click Edit All Guides.</p>' : '') +
        '<div class="pull-foot"><button type="button" class="btn" data-action="pull-more">Pull more</button></div>' +
        '</section>';
    }

    var parts = pull.path ? pull.path.split('/') : [], soFar = '';
    var crumbs = (parts.length || pull.unfiled) ? '<button type="button" class="link-btn" data-action="pull-open" data-path="">All folders</button>' : '<strong>All folders</strong>';
    if (pull.unfiled) crumbs += ' <span class="pull-sep">/</span> <strong>Not in a folder</strong>';
    parts.forEach(function (seg, i) {
      soFar = i ? soFar + '/' + seg : seg;
      crumbs += ' <span class="pull-sep">/</span> ' + (i === parts.length - 1 ? '<strong>' + esc(seg) + '</strong>' : '<button type="button" class="link-btn" data-action="pull-open" data-path="' + escAttr(soFar) + '">' + esc(seg) + '</button>');
    });

    var body;
    if (pull.loading) body = '<p class="hint">Loading from Descript…</p>';
    else if (pull.error) body = '<p class="notice notice-warn">' + esc(pull.error) + '</p><div class="pull-foot"><button type="button" class="btn" data-action="pull-open" data-path="' + escAttr(pull.path) + '"' + (pull.unfiled ? ' data-unfiled="1"' : '') + '>Try again</button></div>';
    else {
      var have = {};
      state.sections.forEach(function (s) { if (s.descriptId) have[s.descriptId] = true; });
      var folders = pull.folders.map(function (path) {
        return '<li><button type="button" class="pull-folder" data-action="pull-open" data-path="' + escAttr(path) + '"><span aria-hidden="true">▸</span> ' + esc(path.split('/').pop()) + '</button></li>';
      }).join('');
      var projects = pull.projects.map(function (p) {
        return '<li><label class="pull-item"><input type="checkbox" data-action="pull-pick" data-id="' + escAttr(p.id) + '"' + (pull.selected[p.id] ? ' checked' : '') + '>' +
          '<span class="pull-name">' + esc(p.name) + '</span>' +
          (have[p.id] ? '<span class="pull-tag">already in this book — pulling again replaces its 1st Draft Transcript</span>' : '') + '</label></li>';
      }).join('');
      // At the top of the Drive, one extra row reaches the projects that are in no folder.
      var loose = (!pull.path && !pull.unfiled) ? '<li><button type="button" class="pull-folder" data-action="pull-open" data-path="" data-unfiled="1"><span aria-hidden="true">▸</span> Not in a folder</button></li>' : '';
      body = ((folders || loose) ? '<ul class="pull-list">' + folders + loose + '</ul>' : '') +
        (projects ? '<ul class="pull-list">' + projects + '</ul>' : '') +
        (pull.more ? '<p class="notice notice-warn">' + (pull.unfiled
          ? 'Only the first 2,000 projects in the Drive were looked through, so some that are in no folder may be missing here.'
          : 'Only the first ' + pull.projects.length + ' are listed. This folder holds more than the page can show — move some into a sub-folder in Descript to reach the rest.') + '</p>' : '') +
        (!folders && !projects && !loose ? '<p class="hint">' + (pull.unfiled ? 'Every project in this Drive is inside a folder.' : 'This folder has no audio guides in it.') + '</p>' : '') +
        (!pull.path && !pull.unfiled ? '<p class="hint">Open a folder to see its audio guides.</p>' : '') +
        (projects ? '<div class="pull-foot">' +
          '<label class="speed-pick"><input type="checkbox" data-action="pull-all"' + (pullSelectedCount() === pull.projects.length ? ' checked' : '') + '> Select all ' + pull.projects.length + '</label>' +
          '<button type="button" class="btn btn-edit" data-action="pull-start"' + (pullSelectedCount() ? '' : ' disabled') + '>' + (pullSelectedCount() ? 'Pull ' + pullSelectedCount() + ' audio guide' + plural(pullSelectedCount()) : 'Pull selected') + '</button>' +
          '<span class="pull-count"></span></div>' : '');
    }
    return '<section class="pull-panel">' + head +
      '<p class="hint">Pick the audio guides to bring into this book. Each one gets its own card, with its 1st Draft Transcript and its timed captions. Nothing in Descript is changed.</p>' +
      '<p class="pull-path">' + crumbs + '</p>' + body +
      '</section>';
  }

  /* ---- Names — SOURCE-OF-TRUTH 6. A guide pulled from Descript is named from its project. ---- */

  var BIBLE_BOOKS = ('Genesis|Exodus|Leviticus|Numbers|Deuteronomy|Joshua|Judges|Ruth|Ezra|Nehemiah|Esther|Job|Psalms|Proverbs|Ecclesiastes|Song of Songs|Song of Solomon|' +
    'Isaiah|Jeremiah|Lamentations|Ezekiel|Daniel|Hosea|Joel|Amos|Obadiah|Jonah|Micah|Nahum|Habakkuk|Zephaniah|Haggai|Zechariah|Malachi|Matthew|Mark|Luke|John|Acts|Romans|' +
    'Galatians|Ephesians|Philippians|Colossians|Titus|Philemon|Hebrews|James|Jude|Revelation').split('|');
  var NUMBERED_BOOKS = { Samuel: 2, Kings: 2, Chronicles: 2, Corinthians: 2, Thessalonians: 2, Timothy: 2, Peter: 2, John: 3 };   // book → how many there are
  var BOOK_BY_KEY = {};
  BIBLE_BOOKS.concat(Object.keys(NUMBERED_BOOKS)).forEach(function (b) { BOOK_BY_KEY[b.toLowerCase().replace(/[^a-z]/g, '')] = b; });
  BOOK_BY_KEY.psalm = 'Psalms';

  // "ED_Isaiah_24_Jones_v1_DS" → "Isaiah – Chapter 24". A name that does not start with a Bible book is returned exactly as it came.
  function scriptNameFromDescript(name) {
    var t = String(name).replace(/\s*\(.*$/, '').replace(/^ED[_ ]+/i, '').split(/[_ ]+/).filter(Boolean), which = '';
    if (/^[123]$/.test(t[0] || '') && t.length > 1) which = t.shift();

  /* ---- What the edit pass and the wording check are given ---- */

  // It still gets through where the sounds truly match, or where a person approved that exact mishearing.

  /* ---- What is waiting for a person ---- */

  function glossaryEvidence() {
