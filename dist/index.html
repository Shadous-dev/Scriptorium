<title>The Scriptorium</title>
<style id="app-style">
*, *::before, *::after { box-sizing: border-box; }

    --edit-hover: #EE7A63;
    --edit-soft: #3D211B;
    --conclude: #6FAE81;
    --conclude-hover: #85BE93;
    --conclude-soft: #22332A;

:root[data-theme="dark"] {
  --paper: #1C1812;
  --paper-raised: #262019;
  --ink: #EDE6D6;
  --ink-soft: #B3A890;
  --ink-faint: #7C7364;
  --line: #3A3226;
  --line-strong: #4A4030;
  --accent: #D08A54;
  --accent-soft: #3A2C1E;
  --accent-ink: #EFC49B;

html { color-scheme: light dark; }

.wrap { display: flex; flex-direction: column; gap: 26px; }

.hero { max-width: 760px; }
.eyebrow { margin: 0 0 10px; font: 600 12px/1 var(--font-body); letter-spacing: .12em; text-transform: uppercase; color: var(--accent-ink); }
.title-field { display: block; width: 100%; border: none; background: transparent; padding: 2px 0; font: 600 clamp(28px, 4vw, 40px)/1.15 var(--font-display); color: var(--ink); text-wrap: balance; border-bottom: 2px solid transparent; }
.title-field::placeholder { color: var(--ink-faint); font-weight: 500; }
.title-field:focus { outline: none; border-bottom-color: var(--accent); }
.dek { margin: 14px 0 0; max-width: 62ch; color: var(--ink-soft); font-size: 16px; }

.tip { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 10px; padding: 16px 20px; }
.tip summary { cursor: pointer; font: 600 14px var(--font-body); color: var(--ink); }
.tip ol { margin: 12px 0 2px; padding-left: 20px; color: var(--ink-soft); font-size: 14.5px; }
.tip li { margin: 6px 0; }
.tip strong { color: var(--ink); }

.search-panel { background: var(--accent-soft); border: 1px solid var(--line-strong); border-radius: 10px; padding: 18px 20px; }
.search-panel label { display: block; font: 600 14px var(--font-body); color: var(--accent-ink); margin-bottom: 4px; }
.search-panel .hint { margin: 0 0 10px; font-size: 13.5px; color: var(--ink-soft); max-width: 68ch; }
.search-panel textarea { width: 100%; resize: vertical; min-height: 44px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--paper-raised); color: var(--ink); font: 500 15px/1.5 var(--font-mono); padding: 10px 12px; }
.search-panel textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

.action-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--paper); padding: 12px 0; border-bottom: 1px solid var(--line); }
.status-line { margin: 0; flex: 1; min-width: 160px; font-size: 13.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.action-bar-end { display: flex; gap: 10px; margin-left: auto; }

.btn { appearance: none; border: 1px solid transparent; border-radius: 8px; padding: 10px 18px; font: 600 14.5px var(--font-body); cursor: pointer; transition: background-color .15s ease, border-color .15s ease, transform .05s ease; }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:disabled { cursor: not-allowed; opacity: .5; }
.btn-add { background: var(--paper-raised); border-color: var(--line-strong); color: var(--ink); }
.btn-add:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-ink); }
.btn-edit { background: var(--edit); color: #FBF3EF; }
.btn-edit:hover:not(:disabled) { background: var(--edit-hover); }
.btn-conclude { background: var(--conclude); color: #F2FAF4; }
.btn-conclude:hover:not(:disabled) { background: var(--conclude-hover); }
.btn-ghost { background: transparent; border-color: var(--line-strong); color: var(--ink-soft); }
.btn-ghost:hover { color: var(--ink); border-color: var(--ink-faint); }
.link-btn { border: none; background: none; padding: 0; cursor: pointer; font: 600 13px var(--font-body); color: var(--accent-ink); text-decoration: underline; }

.overview { background: var(--paper-raised); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 18px 20px; }
.overview h3 { margin: 0 0 10px; font: 600 15px var(--font-body); color: var(--ink); }
.overview-list { margin: 0; padding-left: 18px; color: var(--ink-soft); font-size: 14px; }
.overview-list li { margin: 5px 0; }
.overview-list strong { color: var(--ink); }

.sections { display: flex; flex-direction: column; gap: 18px; }

.section-name::placeholder { color: var(--ink-faint); font-weight: 500; }
.section-name:focus { outline: none; border-bottom-color: var(--accent); }
.chip { flex-shrink: 0; font: 600 11.5px var(--font-body); letter-spacing: .03em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.chip-draft { background: var(--line); color: var(--ink-soft); }
.chip-editing { background: var(--accent-soft); color: var(--accent-ink); }
.chip-edited { background: var(--conclude-soft); color: var(--conclude); }
.chip-error { background: var(--warn-soft); color: var(--warn); }
.icon-btn { flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink-soft); font-size: 18px; line-height: 1; cursor: pointer; }
.icon-btn:hover { border-color: var(--edit); color: var(--edit); }

.section-body { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 880px) { .section-body { grid-template-columns: 1fr 1fr; } }
.pane label { display: block; font: 600 12px var(--font-body); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 6px; }
.pane textarea { width: 100%; min-height: 190px; resize: vertical; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--paper); color: var(--ink); font: 400 14.5px/1.6 var(--font-mono); padding: 12px; }
.pane textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.corrected-output { min-height: 190px; max-height: 420px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--accent-soft); color: var(--ink); font: 400 14.5px/1.6 var(--font-mono); padding: 12px; white-space: pre-wrap; }
.corrected-output.is-empty { color: var(--ink-faint); font-family: var(--font-body); font-style: italic; }

.section-details { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
.section-summary { margin: 0 0 12px; color: var(--ink-soft); font-size: 14.5px; max-width: 72ch; }
.detail-block { margin-top: 12px; }
.detail-block h4 { margin: 0 0 8px; font: 600 12.5px var(--font-body); letter-spacing: .03em; text-transform: uppercase; color: var(--ink-faint); }
.misheard-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.misheard-table th { text-align: left; font: 600 11.5px var(--font-body); text-transform: uppercase; letter-spacing: .03em; color: var(--ink-faint); padding: 6px 10px; border-bottom: 1px solid var(--line-strong); }
.misheard-table td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); }
.misheard-table .mono { font-family: var(--font-mono); }
.misheard-table tr:last-child td { border-bottom: none; }
.flag-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.flag-list li { display: flex; flex-direction: column; gap: 3px; background: var(--warn-soft); border-radius: 8px; padding: 10px 12px; }
.flag-quote { font-family: var(--font-mono); font-size: 13px; color: var(--ink); }
.flag-issue { font-size: 13.5px; color: var(--ink-soft); }
.section-error { margin: 14px 0 0; font-size: 13.5px; color: var(--edit); }
.redo-line { margin: 12px 0 0; text-align: right; }

.conclude-bar { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 14px; }
.approve-prompt { margin: 0; font: 600 16px var(--font-display); color: var(--ink); }
.approve-row { display: flex; align-items: flex-start; gap: 10px; font-size: 14.5px; color: var(--ink); cursor: pointer; }
.approve-row input { margin-top: 3px; width: 17px; height: 17px; accent-color: var(--conclude); }
.approve-row input:disabled { cursor: not-allowed; }
.conclude-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.doc-result { margin: 0; font-size: 14px; color: var(--ink-soft); }
.doc-result a { color: var(--conclude); font-weight: 600; }
.doc-result.is-error { color: var(--edit); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.notice { margin: 0; padding: 12px 16px; border-radius: 8px; font-size: 14px; }
.notice-warn { background: var(--warn-soft); color: var(--ink); border: 1px solid var(--warn); }

/* Clearing the workbench: a quiet destructive button, and a confirm step. */
.btn-quiet-danger { background: transparent; border-color: var(--line-strong); color: var(--ink-soft); margin-left: 4px; }
.btn-quiet-danger:hover:not(:disabled) { border-color: var(--edit); color: var(--edit); }
.btn-danger { background: var(--edit); color: #FBF3EF; }
.btn-danger:hover:not(:disabled) { background: var(--edit-hover); }

.modal-backdrop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--scrim); }
.modal-card { width: 100%; max-width: 470px; background: var(--paper-raised); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow-2); padding: 24px; display: flex; flex-direction: column; gap: 14px; }
.modal-title { margin: 0; font: 600 21px var(--font-display); color: var(--ink); text-wrap: balance; }
.modal-body { margin: 0; font-size: 14.5px; color: var(--ink-soft); }

.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }

.notice-info { background: var(--accent-soft); color: var(--ink); border: 1px solid var(--line-strong); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.notice-dismiss { flex-shrink: 0; border: none; background: none; cursor: pointer; color: var(--ink-soft); font-size: 17px; line-height: 1; padding: 0 2px; }
.notice-dismiss:hover { color: var(--ink); }

/* ---- v22: loading skeleton, save indicator, collapsible cards, copy button ---- */
.skeleton-card { background: var(--paper-raised); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px 20px; }
.skeleton-line { height: 14px; border-radius: 6px; background: var(--line); margin: 10px 0; }
.skeleton-line.w40 { width: 40%; } .skeleton-line.w70 { width: 70%; } .skeleton-line.tall { height: 120px; margin-top: 16px; }
.action-bar .btn:disabled, .action-bar input:disabled { opacity: .5; }
input:disabled, textarea:disabled { cursor: wait; }

.save-state { margin: 0; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }
.save-state.is-saving { color: var(--accent-ink); }

.bar-group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.speed-pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-soft); }
.speed-pick select { font: 600 12.5px var(--font-body); color: var(--ink); background: var(--paper-raised); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 6px; }

.section-card.is-collapsed { padding-bottom: 14px; }
.section-card.is-collapsed .section-head { margin-bottom: 0; }
.collapse-btn { flex-shrink: 0; width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink-soft); font-size: 13px; line-height: 1; cursor: pointer; }
.collapse-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.section-meta { margin: 0 8px 0 0; font-size: 12.5px; color: var(--ink-faint); white-space: nowrap; }
.chip-stale { background: var(--warn-soft); color: var(--warn); }
.stale-note { margin: 8px 0 0; font-size: 13px; color: var(--warn); }

.pane-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.pane-head label { margin: 0; }
.copy-btn { border: 1px solid var(--line-strong); background: var(--paper-raised); color: var(--ink-soft); border-radius: 6px; font: 600 11.5px var(--font-body); padding: 3px 8px; cursor: pointer; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.copy-btn.is-done { border-color: var(--conclude); color: var(--conclude); }

.doc-link-line { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.doc-link-line a { color: var(--conclude); font-weight: 600; }

/* ---- v23: verses in bold, before/after tables, folded grammar list ---- */
.corrected-output strong.verse { font-weight: 600; color: var(--ink); background: var(--paper-raised); box-shadow: inset 0 -2px 0 var(--accent); padding: 0 1px; border-radius: 2px; }
.misheard-table td.was { color: var(--ink-soft); text-decoration: line-through; text-decoration-color: var(--edit); text-decoration-thickness: 1.5px; }
.misheard-table td.now { color: var(--ink); font-weight: 500; }
.detail-fold > summary { cursor: pointer; font: 600 12.5px var(--font-body); letter-spacing: .03em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
.detail-fold > summary:hover { color: var(--accent-ink); }
.verse-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.verse-list li { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 10px; font-size: 13.5px; align-items: baseline; }
.verse-ref { font-weight: 600; color: var(--accent-ink); }
.verse-ref em { font-weight: 500; color: var(--ink-faint); }
.verse-quote { color: var(--ink-soft); font-family: var(--font-mono); font-size: 12.5px; }
@media (max-width: 600px) { .verse-list li { grid-template-columns: 1fr; gap: 2px; } }

/* ---- v24: laid-out corrected script (verse blocks), uncertain references, extra controls ---- */
.corrected-output.is-blocks { white-space: normal; font: 400 14.5px/1.6 var(--font-body); }
.corrected-output.is-blocks p { margin: 0 0 12px; }
.corrected-output.is-blocks p:last-child { margin-bottom: 0; }
.verse-block { margin: 12px 0 14px 10px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--paper-raised); border-radius: 0 6px 6px 0; }
.verse-block strong { font-weight: 600; color: var(--ink); }
.verse-block.is-uncertain { border-left-color: var(--warn); }
.verse-list li.is-uncertain .verse-ref { color: var(--warn); }
.verse-spoken { display: block; font-weight: 400; font-size: 12px; color: var(--ink-faint); }
.verse-warn { display: block; font-family: var(--font-body); font-size: 12.5px; color: var(--warn); margin-top: 2px; }
.speed-pick input[type=checkbox] { accent-color: var(--accent); margin: 0 2px 0 0; }
</style>

     ================================================================== */

  // A normalised copy of `text` (straight quotes, single spaces) plus a map from each
  // normalised index back to the original, so a loose match can still be applied exactly.
  function normIndex(text) {
    var norm = '', map = [], lastSpace = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i], c = ch.charCodeAt(0);
      if (c === 0x2018 || c === 0x2019 || c === 0x02BC) ch = "'";
      else if (c === 0x201C || c === 0x201D) ch = '"';
      else if (c === 0x00A0 || c === 0x200A || c === 0x2009 || /\s/.test(ch)) ch = ' ';
      if (ch === ' ') { if (lastSpace) continue; lastSpace = true; } else lastSpace = false;
      norm += ch; map.push(i);
    }
    return { norm: norm, map: map };
  }
  function normString(str) { return normIndex(String(str || '')).norm.trim(); }

  // Find `needle` in `text` starting near `from`; exact first, then normalised. Returns {start,end} or null.
  function locate(text, needle, from, caseInsensitive) {
    needle = String(needle || ''); if (!needle) return null;
    var idx = text.indexOf(needle, from || 0);
    if (idx === -1 && from) idx = text.indexOf(needle);
    if (idx !== -1) return { start: idx, end: idx + needle.length };
    var ni = normIndex(text), n = normString(needle);
    if (!n) return null;
    var hay = ni.norm, nd = n;
    if (caseInsensitive) { hay = hay.toLowerCase(); nd = nd.toLowerCase(); }
    var nFrom = 0;
    if (from) { while (nFrom < ni.map.length && ni.map[nFrom] < from) nFrom++; }
    var j = hay.indexOf(nd, nFrom);
    if (j === -1 && nFrom) j = hay.indexOf(nd);
    if (j === -1) return null;
    return { start: ni.map[j], end: ni.map[j + nd.length - 1] + 1 };
  }

  // Apply the editor's find/replace list in order. Edits that cannot be placed are returned separately.
  function applyEdits(raw, edits) {
    var text = raw, cursor = 0, applied = [], unapplied = [];
    (edits || []).forEach(function (e) {
      var find = String((e && e.find) || ''), repl = String((e && e.replace) || '');
      if (!find || find === repl) return;
      var hit = locate(text, find, cursor, false);
      if (!hit) { unapplied.push({ find: find, replace: repl, kind: String((e && e.kind) || 'grammar'), note: String((e && e.note) || '') }); return; }
      text = text.slice(0, hit.start) + repl + text.slice(hit.end);
      cursor = hit.start + repl.length;
      applied.push({ find: find, replace: repl, kind: String((e && e.kind) || 'grammar'), note: String((e && e.note) || '') });
    });
    return { text: text, applied: applied, unapplied: unapplied };
  }

  /* ------------------------------------------------------------------
     Layout — the corrected prose plus the verses the editor found, laid
     out the way the finished scripts are published: every quoted verse in
     its own paragraph, in quotation marks, bold, set off as a block quote,
     with its reference after it. Derived from the saved text each time,
     so it is never baked into the script itself.
     ------------------------------------------------------------------ */

  function refLabel(v) {
    var c = String((v && v.canonical) || '').trim();
    if (!c) return '';
    if (v.confidence === 'low') { var m = c.match(/^(.*?\d+):/); return m ? m[1] + ':?' : c + '?'; }
    return c;
  }

  // One clean pair of double quotes around the verse; speech inside it in single quotes. The
  // transcript's own marks are often doubled, curly, or missing a partner, so the inner speech
  // quotes are re-balanced from their positions rather than trusted.
  function normalizeVerseQuotes(inner) {
    inner = inner.replace(/^["“”]+\s*/, '').replace(/\s*["“”]+$/, '').trim();
    var open = false, needLead = false, re = /["“”]/g, m;
    while ((m = re.exec(inner))) {
      var ch = m[0], prev = m.index ? inner[m.index - 1] : '';
      var isOpener = ch === '“' || (ch === '"' && (!prev || /[\s(:—–\-\[]/.test(prev)));
      if (isOpener) open = true; else { if (!open) needLead = true; open = false; }
    }
    inner = inner.replace(/[“”"]/g, "'");
    if (needLead) inner = "'" + inner;
    if (open) inner = inner + "'";
    return '"' + inner + '"';
  }

  function isUncertain(v) { return v.confidence === 'low' || !v.canonical; }

  // Where a verse sits in the corrected text. New results carry two short anchors (the first
  // and last few words); older saved results carry the whole quote. Either way the text itself
  // is the source — the span is found here, not re-typed by the editor.
  function verseSpan(text, v) {
    if (v.startsWith) {
      var head = locate(text, v.startsWith, 0, true); if (!head) return null;
      var tail = v.endsWith ? locate(text, v.endsWith, head.start, true) : null;
      if (!tail || tail.start < head.start || tail.end - head.start > 2500) return null;
      return { start: head.start, end: tail.end };
    }
    var quote = String(v.quote || ''); if (!quote) return null;
    var q = locate(text, quote, 0, true);
    if (!q && quote.length > 60) {
      var h = locate(text, quote.slice(0, 50), 0, true);
      if (h) q = { start: h.start, end: Math.min(text.length, h.start + quote.length) };
    }
    return q;
  }

  function layoutBlocks(s) {
    var text = String(s.corrected || '');
    var hits = [];
    (s.verses || []).forEach(function (v) {
      var q = v && verseSpan(text, v); if (!q) return;
      var st = q.start, en = q.end;
      while (st > 0 && /["“]/.test(text[st - 1])) st--;
      while (en < text.length && /["”]/.test(text[en])) en++;
      // Absorb a reference the speaker or an earlier pass already put after the quote.
      var tail = text.slice(en).match(/^\s*\(([1-3]?\s?[A-Za-z]+\.?\s+\d+(?::\d+(?:[-–]\d+)?)?)\)/);
      if (tail) en += tail[0].length;
      hits.push({ start: st, end: en, verse: v });
    });
    hits.sort(function (a, b) { return a.start - b.start; });
    var kept = []; hits.forEach(function (h) { var last = kept[kept.length - 1]; if (!last || h.start >= last.end) kept.push(h); });

    var blocks = [], pos = 0;
    function prose(chunk) {
      chunk.split(/\n\s*\n/).forEach(function (p) {
        p = p.replace(/\s*\n\s*/g, ' ').replace(/[ \t]+/g, ' ').trim();
        if (p) blocks.push({ type: 'p', text: p });
      });
    }
    kept.forEach(function (h) {
      prose(text.slice(pos, h.start));
      var inner = text.slice(h.start, h.end).replace(/\s*\(([1-3]?\s?[A-Za-z]+\.?\s+\d+(?::\d+(?:[-–]\d+)?)?)\)\s*$/, '').replace(/\s*\n+\s*/g, ' ').replace(/[ \t]+/g, ' ').trim();
      // Strip whatever quote marks the transcript had around the verse (doubled, curly, mismatched),
      // turn any double quotes still inside it into single quotes for the speech within the verse,
      // then wrap the whole verse in one clean pair of double quotes.
      inner = normalizeVerseQuotes(inner);
      blocks.push({ type: 'verse', text: inner, ref: refLabel(h.verse), uncertain: isUncertain(h.verse), note: String(h.verse.note || '') });
      pos = h.end;
    });
    prose(text.slice(pos));
    return blocks;
  }

  var DOC_GAP = '<p>&nbsp;</p>'; // an empty paragraph: the one thing Google keeps as a visible blank line
  function blocksToHtml(blocks, forDoc) {
    return blocks.map(function (b) {
      if (b.type === 'verse') {
        var line = esc(b.text) + (b.ref ? ' (' + esc(b.ref) + ')' : '');
        return forDoc ? '<blockquote><p><b>' + line + '</b></p></blockquote>' : '<blockquote class="verse-block' + (b.uncertain ? ' is-uncertain' : '') + '"><strong>' + line + '</strong></blockquote>';
      }
      return '<p>' + esc(b.text) + '</p>';
    }).join(forDoc ? DOC_GAP : '');
  }
  function blocksToPlain(blocks) {
    return blocks.map(function (b) { return b.type === 'verse' ? b.text + (b.ref ? ' (' + b.ref + ')' : '') : b.text; }).join('\n\n');
  }

  /* ==================================================================
     Rendering
     ================================================================== */

  function statusLabel(s) {
    if (s.status === 'editing') return 'Editing…';
    if (s.status === 'edited') return isStale(s) ? 'Edited — transcript changed' : 'Edited ' + relTime(s.editedAt);
    if (s.status === 'error') return 'Needs attention';
    return 'Not yet edited';
  }
  function chipClass(s) { return (s.status === 'edited' && isStale(s)) ? 'chip-stale' : 'chip-' + s.status; }

  function changeTable(rows, h1, h2) {
    var why = rows.some(function (m) { return m.note; });
    return '<table class="misheard-table"><thead><tr><th>' + h1 + '</th><th>' + h2 + '</th>' + (why ? '<th>Why</th>' : '') + '</tr></thead><tbody>' +
      rows.map(function (m) { return '<tr><td class="mono was">' + esc(m.find != null ? m.find : m.heard) + '</td><td class="mono now">' + esc(m.replace != null ? m.replace : m.likely) + '</td>' + (why ? '<td>' + esc(m.note || '') + '</td>' : '') + '</tr>'; }).join('') +
      '</tbody></table>';
  }

  function renderSectionDetails(s, blocks) {
    var edits = s.edits || [];
    var misheardRows = edits.length ? edits.filter(function (e) { return e.kind === 'misheard'; }) : (s.misheard || []);
    var verseFixRows = edits.filter(function (e) { return e.kind === 'verse-fix'; });
    var grammarRows = edits.filter(function (e) { return e.kind !== 'misheard' && e.kind !== 'verse-fix'; });
    var misheardHtml = misheardRows.length ? '<div class="detail-block"><h4>Words that may have been misheard</h4>' + changeTable(misheardRows, 'Heard as', 'Likely meant') + '</div>' : '';
    var verseFixHtml = verseFixRows.length ? '<div class="detail-block"><h4>Mishearings fixed inside a verse</h4>' + changeTable(verseFixRows, 'Transcript had', 'Corrected to') + '</div>' : '';
    var joinCount = grammarRows.filter(function (e) { return e.kind === 'paragraph'; }).length;
    var cueCount = grammarRows.filter(function (e) { return e.kind === 'cue'; }).length;
    var capCount = grammarRows.filter(function (e) { return e.kind === 'capitalization'; }).length;
    var grammarHtml = grammarRows.length ? '<details class="detail-block detail-fold"><summary>' + grammarRows.length + ' grammar, punctuation &amp; paragraph change' + plural(grammarRows.length) + (joinCount ? ' (' + joinCount + ' paragraph' + plural(joinCount) + ' joined)' : '') + (cueCount ? ' (stage cues removed)' : '') + (capCount ? ' (' + capCount + ' capitalization fix' + (capCount === 1 ? '' : 'es') + ')' : '') + '</summary>' + changeTable(grammarRows, 'Before', 'After') + '</details>' : '';
    var unappliedHtml = (s.unapplied && s.unapplied.length) ? '<div class="detail-block"><h4>Suggested but couldn’t be placed — check by hand</h4>' + changeTable(s.unapplied, 'Looked for', 'Wanted to make it') + '</div>' : '';
    var placed = blocks.filter(function (b) { return b.type === 'verse'; }).length;
    var versesHtml = (s.verses && s.verses.length) ?
      '<div class="detail-block"><h4>Scripture used — ' + placed + ' of ' + s.verses.length + ' set in bold' + (placed < s.verses.length ? ' (the rest could not be found in the text)' : '') + '</h4><ul class="verse-list">' +
      s.verses.map(function (v) {
        var q = v.startsWith ? v.startsWith + ' … ' + v.endsWith : String(v.quote || '');
        var short = q.length > 90 ? q.slice(0, 88).replace(/\s+\S*$/, '') + '…' : q;
        var label = v.canonical ? esc(refLabel(v)) : '<em>reference unknown — check</em>';
        if (v.reference) label += '<span class="verse-spoken">spoken: ' + esc(v.reference) + '</span>';
        var unsure = isUncertain(v);
        var warn = unsure ? '<span class="verse-warn">' + esc(v.note || (v.canonical ? 'Not sure of this reference' : 'Could not work out the reference')) + '</span>' : '';
        return '<li' + (unsure ? ' class="is-uncertain"' : '') + '><span class="verse-ref">' + label + '</span><span class="verse-quote">“' + esc(short) + '”' + warn + '</span></li>';
      }).join('') + '</ul></div>' : '';
    var nonsenseHtml = (s.nonsensical && s.nonsensical.length) ?
      '<div class="detail-block"><h4>Doesn’t quite make sense</h4><ul class="flag-list">' +
      s.nonsensical.map(function (n) { return '<li><span class="mono flag-quote">“' + esc(n.original) + '”</span><span class="flag-issue">' + esc(n.issue) + '</span></li>'; }).join('') +
      '</ul></div>' : '';
    return '<div class="section-details"><p class="section-summary">' + esc(s.summary || '') + '</p>' + versesHtml + misheardHtml + verseFixHtml + nonsenseHtml + unappliedHtml + grammarHtml + '</div>';
  }

  function sectionMeta(s) {
    if (s.status !== 'edited') return '';
    var bits = [];
    if (s.verses && s.verses.length) {
      var unsure = s.verses.filter(isUncertain).length;
      bits.push(s.verses.length + ' verse' + plural(s.verses.length) + (unsure ? ' (' + unsure + ' to check)' : ''));
    }
    if (s.misheard && s.misheard.length) bits.push(s.misheard.length + ' misheard');
    if (s.nonsensical && s.nonsensical.length) bits.push(s.nonsensical.length + ' to check');
    return bits.join(' · ');
  }

  function renderSection(s) {
    var isCollapsed = !!collapsed[s.id];
    var head =
      '<div class="section-head">' +
      '<button type="button" class="collapse-btn" data-action="toggle-collapse" data-id="' + s.id + '" aria-label="' + (isCollapsed ? 'Expand' : 'Collapse') + '" title="' + (isCollapsed ? 'Expand' : 'Collapse') + '">' + (isCollapsed ? '▸' : '▾') + '</button>' +
      '<input class="section-name" data-field="name" data-id="' + s.id + '" type="text" placeholder="e.g. Job – Chapter 2" value="' + escAttr(s.name) + '" aria-label="Script name">' +
      (isCollapsed && sectionMeta(s) ? '<span class="section-meta">' + esc(sectionMeta(s)) + '</span>' : '') +
      '<span class="chip ' + chipClass(s) + '"' + (s.status === 'edited' && !isStale(s) && s.editedAt ? ' data-ts="' + s.editedAt + '"' : '') + '>' + esc(statusLabel(s)) + '</span>' +
      '<button type="button" class="icon-btn" data-action="remove-section" data-id="' + s.id + '" aria-label="Remove this script" title="Remove this script">−</button>' +
      '</div>';
    if (isCollapsed) return '<article class="section-card is-collapsed" data-section="' + s.id + '">' + head + '</article>';

    var blocks = s.corrected ? layoutBlocks(s) : [];
    var corrected = s.corrected ? blocksToHtml(blocks, false) : 'Not edited yet — click “Edit All Scripts” above.';
    var extra = '';
    if (s.status === 'edited') {
      extra = (isStale(s) ? '<p class="stale-note">The transcript has changed since this was edited — run Edit again to refresh the corrected script.</p>' : '') +
        renderSectionDetails(s, blocks) +
        '<p class="redo-line"><button type="button" class="link-btn" data-action="redo-section" data-id="' + s.id + '">Redo this one</button></p>';
    }
    if (s.status === 'error' && s.error === '__stopped__') extra = '<p class="section-error">Stopped before this one finished. <button type="button" class="link-btn" data-action="redo-section" data-id="' + s.id + '">Try again</button></p>';
    else if (s.status === 'error') extra = '<p class="section-error">Couldn’t edit this one: ' + esc(s.error || 'unknown error') + '. <button type="button" class="link-btn" data-action="redo-section" data-id="' + s.id + '">Try again</button></p>';
    return (
      '<article class="section-card" data-section="' + s.id + '">' + head +
      '<div class="section-body">' +
      '<div class="pane"><div class="pane-head"><label>Raw transcript (from Descript)</label></div>' +
      '<textarea data-field="raw" data-id="' + s.id + '" rows="8" placeholder="Paste the Descript transcript here — e.g. &quot;So Eli who answered and said, so far said unto Job…&quot;">' + esc(s.raw) + '</textarea></div>' +
      '<div class="pane pane-corrected"><div class="pane-head"><label>Corrected script</label>' +
      (s.corrected ? '<button type="button" class="copy-btn" data-action="copy-corrected" data-id="' + s.id + '" title="Copies the script with bold verses and block quotes, ready to paste">Copy for YouVersion</button>' : '') + '</div>' +
      '<div class="corrected-output' + (s.corrected ? ' is-blocks' : ' is-empty') + '">' + corrected + '</div></div>' +
      '</div>' + extra +
      '</article>'
    );
  }

  function renderOverview() {
    if (!state.lastEditAt) return '';
    var rows = state.sections.map(function (s) {
      var detail;
      if (s.status === 'edited') {
        var unsureRefs = (s.verses || []).filter(isUncertain).length;
        detail = (s.verses || []).length + ' verse' + plural((s.verses || []).length) + (unsureRefs ? ' (' + unsureRefs + ' reference' + plural(unsureRefs) + ' to check)' : '') + ', ' + s.misheard.length + ' misheard word' + plural(s.misheard.length) + ', ' + s.nonsensical.length + ' sentence' + plural(s.nonsensical.length) + ' to double-check' + (isStale(s) ? ' — transcript changed since' : '');
      }
      else if (s.status === 'error' && s.error === '__stopped__') detail = 'stopped before finishing';
      else if (s.status === 'error') detail = 'couldn’t be edited (' + esc(s.error || 'error') + ')';
      else if (!s.raw.trim()) detail = 'no transcript yet';
      else detail = 'not yet edited';
      return '<li><strong>' + esc(s.name || 'Untitled script') + '</strong> — ' + detail + '</li>';
    }).join('');
    return '<section class="overview"><h3>Overview — last edit pass <span data-ts="' + state.lastEditAt + '">' + esc(relTime(state.lastEditAt)) + '</span></h3><ul class="overview-list">' + rows + '</ul></section>';
  }

  function statusSummary() {
    var total = state.sections.length;
    var edited = state.sections.filter(function (s) { return s.status === 'edited'; }).length;
    var errored = state.sections.filter(function (s) { return s.status === 'error'; }).length;
    if (dbStatus === 'loading') return 'Loading your saved scripts…';
    if (editState) {
      var activeNow = state.sections.filter(function (s) { return s.status === 'editing'; }).length;
      return editState.done + ' of ' + editState.total + ' done in this pass — editing ' + activeNow + ' now…';
    }
    var line = total + ' script' + plural(total) + ' · ' + edited + ' edited';
    if (errored) line += ' · ' + errored + ' needs attention';
    return line;
  }

  function renderDocResult() {
    if (state.docResult) {
      if (state.docResult.method === 'pending') return '<p class="doc-result" id="doc-progress">' + esc(state.docResult.progress || 'Building your Google Doc…') + '</p>';
      if (state.docResult.method === 'drive') {
        if (state.docResult.count != null) {
          var failedNote = state.docResult.failed ? ' ' + state.docResult.failed + ' could not be created — try again for those.' : '';
          return '<p class="doc-result">Created ' + state.docResult.count + ' Doc' + plural(state.docResult.count) + ' in a new folder in your Google Drive — <a href="' + escAttr(state.docResult.url) + '" target="_blank" rel="noopener">open the folder</a>.' + esc(failedNote) + '</p>';
        }
        return '<p class="doc-result">Created in your Google Drive — <a href="' + escAttr(state.docResult.url) + '" target="_blank" rel="noopener">open the doc</a>.</p>';
      }
      if (state.docResult.method === 'download') return '<p class="doc-result">Saved as a file — open it with Google Docs (File › Open, or drag it into Drive) to keep editing there.</p>';
      return '<p class="doc-result is-error">' + esc(state.docResult.message || 'Something went wrong.') + '</p>';
    }
    if (state.lastDoc && state.lastDoc.url) {
      return '<p class="doc-link-line">Last created <span data-ts="' + state.lastDoc.at + '">' + esc(relTime(state.lastDoc.at)) + '</span> — <a href="' + escAttr(state.lastDoc.url) + '" target="_blank" rel="noopener">' + (state.lastDoc.kind === 'folder' ? 'open the folder of Docs' : 'open the Google Doc') + '</a>.</p>';
    }
    return '';
  }

  function renderModal() {
    if (!confirmState) return '';
    return (
      '<div class="modal-backdrop" data-action="confirm-cancel" role="dialog" aria-modal="true" aria-label="' + escAttr(confirmState.title) + '">' +
      '<div class="modal-card" data-stop-click>' +
      '<h2 class="modal-title">' + esc(confirmState.title) + '</h2>' +
      '<p class="modal-body">' + esc(confirmState.body) + '</p>' +
      (confirmState.warn ? '<p class="modal-warn">' + esc(confirmState.warn) + '</p>' : '') +
      '<div class="modal-actions">' +
      '<button type="button" class="btn btn-ghost" data-action="confirm-cancel">Cancel</button>' +
      '<button type="button" class="btn btn-danger" data-action="confirm-ok">' + esc(confirmState.confirmLabel) + '</button>' +
      '</div></div></div>'
    );
  }

  function renderSkeleton() {
    var card = '<div class="skeleton-card" aria-hidden="true"><div class="skeleton-line w40"></div><div class="skeleton-line tall"></div></div>';
    return '<div class="sections">' + card + card + card + '</div>';
  }

  function saveStateLabel() {
    if (dbStatus !== 'ready') return '';
    if (savesInFlight > 0 || Object.keys(pendingSaves).length || metaTimer) return 'Saving…';
    return everSaved ? 'All changes saved' : '';
  }

  function renderApp() {
    var loading = dbStatus === 'loading';
    var anyEdited = state.sections.some(function (s) { return s.status === 'edited'; });
    var editRunning = !!editState || state.sections.some(function (s) { return s.status === 'editing'; });
    var pending = !!(state.docResult && state.docResult.method === 'pending');
    var hasAnything = state.sections.some(function (s) { return s.raw.trim() || s.name.trim(); });
    var toEdit = state.sections.filter(needsEdit).length;
    var anyCollapsible = state.sections.some(function (s) { return s.status === 'edited' && !collapsed[s.id]; });
    var anyCollapsed = state.sections.some(function (s) { return collapsed[s.id]; });
    var concludeDisabled = (!anyEdited || !state.approved || editRunning || pending || loading) ? ' disabled' : '';
    var dis = loading ? ' disabled' : '';

    var notice = '';
    if (dbStatus === 'unavailable') notice = '<p class="notice notice-warn">Saved work can’t be reached in this view, so anything you change here won’t be kept. Reload the page, or open the artifact from your Claude gallery.</p>';
    else if (saveError) notice = '<p class="notice notice-warn">' + esc(saveError) + '</p>';
    if (flash) notice += '<div class="notice notice-info"><span>' + esc(flash) + '</span><button type="button" class="notice-dismiss" data-action="dismiss-flash" aria-label="Dismiss">×</button></div>';

    var editLabel = editRunning ? 'Editing…' : (toEdit && toEdit < state.sections.length ? 'Edit ' + toEdit + ' Script' + plural(toEdit) : 'Edit All Scripts');
    var saveLabel = saveStateLabel();

    return (
      '<div class="wrap">' +
      '<header class="hero">' +
      '<p class="eyebrow">Through the Word · Script Workbench</p>' +
      '<input class="title-field" data-field="bookTitle" type="text" placeholder="Untitled book or plan" value="' + escAttr(state.bookTitle) + '" aria-label="Book or plan title"' + dis + '>' +
      '<p class="dek">Turn Descript’s AI transcript of each audio guide into a clean, accurate script — grammar fixed, misheard names caught, nothing about how it sounds changed.</p>' +
      '</header>' +
      '<details class="tip"><summary>How this works</summary><ol>' +
      '<li>Paste each chapter’s Descript transcript into its own script below — use <strong>+ Add Script</strong> for as many as the plan needs.</li>' +
      '<li>List any names or terms Descript’s AI likely misheard under <strong>Words to Search For</strong>.</li>' +
      '<li>Click <strong>Edit All Scripts</strong> to fix grammar, catch misheard words, and flag anything that still doesn’t make sense. Bible verses and their references come back in <strong>bold</strong> — their wording is left alone apart from misheard words, which are listed separately. Each finished script is saved on its own, so you can stop and resume anytime without losing what’s already done.</li>' +
      '<li>Review the overview, check the approval box, then click <strong>Create Google Docs</strong> — one Doc per script in a folder, or one Doc for the book. Or use <strong>Copy for YouVersion</strong> on any script to paste it straight in with the verses already formatted.</li>' +

  function promptHeader(section) {

      'Script name: ' + (section.name || '(untitled section)') + '\n' +
      'Names or terms the speaker uses that may be misheard: ' + (state.wordsToSearchFor || '(none listed)') + '\n\n' +
      'Fix the following WITHOUT changing the speaker’s wording, meaning, tone, or intent:\n' +
      '1. GRAMMAR AND PUNCTUATION — the main job.\n' +
      '- Every question ends with a question mark, including rhetorical ones mid-flow ("Or was it a Big Bang?"); transcription flattens these to periods.\n' +
      '- Commas for direct address ("Welcome back, my friends"), introductory and interrupting phrases, and lists (serial comma).\n' +
      '- Statements end with periods; a full sentence in parentheses keeps its period inside. "?!" is fine for an exclaimed question.\n' +
      '- Hyphenate compound modifiers before a noun ("so-called", "well-meaning").\n' +
      '- CAPITALIZATION: names, places, and titles, consistently; ordinary nouns stay lowercase ("my dad", "the church").\n' +
      '- Keep deliberate fragments and the casual voice ("No soapbox." "Then, 1964."). Never merge or complete them.\n' +

      '- Keep the dashes already there; add one only where it does grammatical work, never just for a pause.\n' +
      '- Remove a line that is only a section label in capitals (e.g. BEARINGS). Words spoken in capitals for emphasis stay.\n' +

      '3. SCRIPTURE: the speaker quotes Bible verses, usually after a reference ("Verse one", "Job 2:4", "Isaiah 3 verses two through four"). Inside a quoted verse fix ONLY misheard words ("the land of us" to "the land of Uz"); change nothing else — not wording, order, capitalization, or punctuation, even where it looks wrong. Translations read oddly on purpose.\n' +
      '4. Flag any sentence that still makes no sense after your edits, with your best guess at what is wrong.\n\n';

      '"canonical" — Book Chapter:Verse, or Chapter:Verse-Verse for a span ("Luke 1:30-33"), worked out from the book this script covers, the spoken reference, and the quoted words (count the verses it runs through); ' +
      '"confidence" — "high" only when sure of the canonical reference, else "low"; "note" — "" when confident, else a few words on the doubt.\n' +
      'A quotation is the whole verse as it appears in the Bible, including narration inside it ("How will this be," Mary asked, "since I am a virgin?"), never the speaker’s commentary. In the corrected text each quoted verse is wrapped in double quotation marks; speech inside a verse uses single quotation marks.\n';

  }

      'Add "kind": "misheard" for a misheard word or name, or "verse-fix" for one inside a quoted verse, each with a "note" of a few words; grammar edits need neither.\n' +

  /* ------------------------------------------------------------------

  var CUE_RE = /[ \t]*\[[^\]\n]{1,120}\][ \t]*/g, PAUSE_RE = /(^|\s)_+(?=\s|$)/g;

  }
  var ABBREV = /(?:\b(?:mr|mrs|ms|dr|st|vs|etc|jr|sr|no|cf|approx|dept|inc|co|ch|vv?)|\be\.g|\bi\.e|\ba\.k\.a|\b[A-Za-z])\.$/i;
  var BOOKS = 'genesis|exodus|leviticus|numbers|deuteronomy|joshua|judges|ruth|samuel|kings|chronicles|ezra|nehemiah|esther|job|psalms?|proverbs|ecclesiastes|song of songs|song of solomon|isaiah|jeremiah|lamentations|ezekiel|daniel|hosea|joel|amos|obadiah|jonah|micah|nahum|habakkuk|zephaniah|haggai|zechariah|malachi|matthew|mark|luke|john|acts|romans|corinthians|galatians|ephesians|philippians|colossians|thessalonians|timothy|titus|philemon|hebrews|james|peter|jude|revelation';
  var BOOK_RE = new RegExp('\\b([123] )?(' + BOOKS + ')(?= \\d)', 'gi');   // a book name followed by a chapter
  var SURE = 'jesus christ bible israel jerusalem satan moses abraham isaac jacob joseph david solomon elijah elisha isaiah jeremiah ezekiel daniel paul peter pharisees egypt babylon bethlehem nazareth galilee'.split(' ');
  var SURE_RE = new RegExp('\\b(' + SURE.join('|') + ')\\b', 'gi');
  var GOD_RE = /\b(?<!\b(?:a|an|false|other|their|your|no|any|strange|pagan|greek|roman)\s)god\b(?!s)/gi;
  var LORD_RE = /\blord\b(?!s)/gi, SPIRIT_RE = /\bholy spirit\b/gi, I_RE = /\bi(?=['’\s]|$)/g;

  function cap(w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }
  function tally(intoEdits, kind, count, label) {
    if (count) intoEdits.push({ find: label, replace: '', kind: kind, note: count + ' place' + plural(count) });
  }

  // Cues and pause marks out; spacing, quote marks, ellipses and sentence ends made regular.
  function mechanics(text, intoEdits) {
    var cues = [];
    text = String(text || '').replace(CUE_RE, function (m) { cues.push(m.trim()); return ' '; }).replace(PAUSE_RE, function (m, lead) { cues.push('_'); return lead; });
    if (cues.length) intoEdits.push({ find: cues.slice(0, 12).join(' ') + (cues.length > 12 ? ' …' : ''), replace: '', kind: 'cue', note: 'removed ' + cues.length + ' stage cue' + plural(cues.length) + ' / pause mark' + plural(cues.length) });
    text = text.replace(/[ \t]+\n/g, '\n').replace(/\n[ \t]+/g, '\n').replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
    var n = 0;
    MECH.forEach(function (r) { var hits = text.match(r[0]); if (hits) { n += hits.length; text = text.replace(r[0], r[1]); } });
    tally(intoEdits, 'spacing', n, 'spacing, quote marks, ellipses, sentence ends');
    return text;
  }

  // Names that are never ordinary words, God and the Lord, "I", Bible books before a chapter
  // number, and the names the user listed. Each distinct fix is one visible row.
  function fixNames(text, intoEdits) {
    var seen = {};
    function note(from, to) { if (from !== to && !seen[from + '>' + to]) { seen[from + '>' + to] = 1; intoEdits.push({ find: from, replace: to, kind: 'capitalization', note: 'name or title' }); } }
    function sub(re, fn) { text = text.replace(re, function () { var out = fn.apply(null, arguments); note(arguments[0], out); return out; }); }
    sub(SURE_RE, function (m) { return cap(m); });
    sub(BOOK_RE, function (m, num, book) { return (num || '') + book.split(' ').map(cap).join(' '); });
    sub(GOD_RE, function () { return 'God'; }); sub(LORD_RE, function () { return 'Lord'; }); sub(SPIRIT_RE, function () { return 'Holy Spirit'; }); sub(I_RE, function () { return 'I'; });
    String(state.wordsToSearchFor || '').split(/[,\n;]+/).forEach(function (w) {
      w = w.trim(); if (w.length < 2) return;
      sub(new RegExp('\\b' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\b', 'gi'), function () { return w; });
    });
    return text;
  }

  // No sentence or paragraph may start lowercase. Abbreviations, initials, decimals and trailing-off dots are left alone.
  function fixCapitals(text, intoEdits) {
    var count = 0;
    function note(before, after) { count += 1; if (count <= 20) intoEdits.push({ find: before, replace: after, kind: 'capitalization', note: 'sentence start' }); }
    text = text.replace(/(^|\n[ \t]*\n[ \t]*)(["“'(]*)([a-z])(\S{0,24})/g, function (m, lead, open, ch, rest) {
      note(open + ch + rest, open + ch.toUpperCase() + rest);
      return lead + open + ch.toUpperCase() + rest;
    });
    text = text.replace(/([.!?])(["”')\]]*)([ \t]+)(["“'(]*)([a-z])(\S{0,24})/g, function (m, p, close, sp, open, ch, rest, offset, whole) {
      var before = whole.slice(Math.max(0, offset - 14), offset + 1);
      if (p === '.' && (ABBREV.test(before) || /\.\.$/.test(before))) return m;
      note(p + close + ' ' + open + ch + rest, p + close + ' ' + open + ch.toUpperCase() + rest);
      return p + close + sp + open + ch.toUpperCase() + rest;
    });
    if (count > 20) intoEdits.push({ find: '(' + (count - 20) + ' more)', replace: '', kind: 'capitalization', note: 'further sentence starts capitalized' });
    return text;
  }

  function str(v) { return String(v == null ? '' : v).trim(); }
  function cleanVerses(list) {
    return Array.isArray(list) ? list.map(function (v) {
      v = v || {};
      return { reference: str(v.reference), startsWith: str(v.startsWith).replace(/^["\u201C]+/, ''), endsWith: str(v.endsWith).replace(/["\u201D]+$/, ''),
               canonical: str(v.canonical), confidence: str(v.confidence).toLowerCase() === 'low' ? 'low' : 'high', note: str(v.note) };
    }).filter(function (v) { return v.startsWith; }) : [];
  }
  function cleanNonsense(list) {
    return Array.isArray(list) ? list.map(function (n) { n = n || {}; return { original: str(n.original), issue: str(n.issue) }; }) : [];
  }

  // Close the paragraph breaks the editor says fall mid-thought. Each join becomes a visible "paragraph" edit.
  function applyJoins(text, joins, intoEdits) {
    if (!repairParagraphs || !Array.isArray(joins)) return text;
    joins.forEach(function (j) {
      var a = str(j && j.endsWith), b = str(j && j.startsWith);
      if (!a || !b) return;
      var ha = locate(text, a, 0, false); if (!ha) return;
      var gap = text.slice(ha.end).match(/^\s*\n\s*\n\s*/); if (!gap) return;
      var hb = locate(text, b, ha.end + gap[0].length, false);
      if (!hb || hb.start !== ha.end + gap[0].length) return;
      text = text.slice(0, ha.end) + ' ' + text.slice(hb.start);
      intoEdits.push({ find: a + ' ¶ ' + b, replace: a + ' ' + b, kind: 'paragraph', note: 'joined a mid-thought break' });
    });
    return text;
  }

  // One route: ask for the edit list, apply it here. Edits that cannot be placed are kept and
  // shown for a hand check — never silently dropped, and never traded for a full rewrite
  // (which costs a whole script's worth of output and shows no edit table).
  function runEditOnSection(s, sample, signal, isRetry) {
    if (s.raw.length > 55000) {
      s.status = 'error'; s.error = 'this script is too long for one pass — try splitting it into two sections';
      return Promise.resolve();
    }
    var local = [];
    var prepared = fixCapitals(fixNames(mechanics(s.raw, local), local), local);
    return sample.json(buildEditsPrompt(s, prepared), { modelTier: 'quick', cache: false, signal: signal }).then(function (data) {
      data = data || {};
      var result = applyEdits(prepared, Array.isArray(data.edits) ? data.edits : []);
      var applied = local.concat(result.applied);
      var text = endSentences(fixCapitals(applyJoins(result.text, data.joins, applied), applied), applied);
      var summary = str(data.summary);
      if (result.unapplied.length > 2) summary += (summary ? ' ' : '') + result.unapplied.length + ' suggested changes could not be placed and are listed below for a hand check — Redo this one if that seems like too many.';
      s.corrected = text; s.summary = summary; s.changeCount = applied.length;
      s.edits = applied; s.unapplied = result.unapplied;
      s.misheard = applied.filter(function (e) { return e.kind === 'misheard'; }).map(function (e) { return { heard: e.find, likely: e.replace, note: e.note }; });
      s.nonsensical = cleanNonsense(data.nonsensical); s.verses = cleanVerses(data.verses); s.method = 'edits';
      s.editedFromRaw = s.raw; s.status = 'edited'; s.editedAt = Date.now(); s.error = null;
    }).catch(function (err) {
      if (err && err.code === 'cancelled') { s.status = 'error'; s.error = '__stopped__'; return; }
      // A garbled or empty answer is not cached, so one more ask is a genuine second attempt.
      if (!isRetry && err && (err.code === 'invalid_json' || err.code === 'empty_completion')) return runEditOnSection(s, sample, signal, true);
      s.status = 'error'; s.error = sampleErrorMessage(err);
    });
  }

  // Runs `concurrency` scripts at once (1 or 2). Each finished script is saved on its own
  // before the worker picks up the next, so an interruption costs at most what was in flight.
  function editAll() {
    syncFieldsFromDom();
    if (dbStatus === 'loading') { showFlash('Still loading your saved scripts — give it a second and try again.'); return; }
    useCap('sample').then(function (sample) {
      if (!sample) { showFlash('This page needs permission to use Claude for editing. Open it in a Claude viewer that allows that, then try again.'); return; }
      var toProcess = state.sections.filter(needsEdit);
      if (!toProcess.length) {
        showFlash(state.sections.some(function (s) { return s.raw.trim(); }) ? 'Every script with text is already up to date.' : 'Add a transcript to at least one script first.');
        return;
      }
      var queue = toProcess.slice(), stoppedFlag = false;
      editControllers = [];
      editState = { total: toProcess.length, done: 0 };
      paint();

      function worker() {
        if (stoppedFlag) return Promise.resolve();
        var item = queue.shift();
        if (!item) return Promise.resolve();
        var ctl = new AbortController();
        editControllers.push(ctl);
        item.status = 'editing'; item.error = null;
        paintSection(item.id); paintStatus();
        return runEditOnSection(item, sample, ctl.signal).then(function () {
          editControllers = editControllers.filter(function (c) { return c !== ctl; });
          if (item.status === 'error' && item.error === '__stopped__') stoppedFlag = true;
          editState.done += 1;
          paintSection(item.id); paintStatus();
          return saveSection(item.id).then(worker);
        });
      }

      var workers = [];
      for (var i = 0; i < concurrency; i++) workers.push(worker());
      return Promise.all(workers).then(function () {
        editState = null; editControllers = [];
        state.lastEditAt = Date.now(); state.approved = false;
        paint();
        return saveMeta();
      });
    });
  }

  function stopEdit() { editControllers.forEach(function (c) { try { c.abort(); } catch (e) {} }); }

  function redoSection(id) {
    syncFieldsFromDom();
    var s = findSection(id);
    if (!s || !s.raw.trim()) return;
    useCap('sample').then(function (sample) {
      if (!sample) { showFlash('This page needs permission to use Claude for editing.'); return; }
      var ctl = new AbortController();
      editControllers.push(ctl);
      s.status = 'editing'; paintSection(id);
      return runEditOnSection(s, sample, ctl.signal).then(function () {
        editControllers = editControllers.filter(function (c) { return c !== ctl; });
        state.approved = false;
        paint();
        return saveSection(s.id).then(saveMeta);
      });
    });
  }

  function toggleApprove(checked) { state.approved = !!checked; paint(); saveMeta(); }
  /* ---- Clearing the workbench for the next book ---- */

  function openConfirm(opts) {
    confirmState = opts; paint();
    var cancel = root.querySelector('[data-action="confirm-cancel"].btn');
    if (cancel) { try { cancel.focus(); } catch (e) {} }
  }
  function closeConfirm() { confirmState = null; paint(); }

  function askClearAll() {
    syncFieldsFromDom();
    var count = state.sections.length;
    var unedited = state.sections.filter(function (s) { return s.raw.trim() && s.status !== 'edited'; }).length;
    openConfirm({
      title: 'Remove all ' + count + ' script' + plural(count) + '?',
      body: 'This deletes every script here, including the corrected text and the words flagged in each one, and it can’t be undone. Your book title and Words to Search For list stay put for the next book, and any Google Doc you already created is untouched.',
      warn: unedited ? unedited + ' of them ' + (unedited === 1 ? 'has' : 'have') + ' not been edited yet.' : '',
      confirmLabel: 'Remove all ' + count + ' script' + plural(count),
      onConfirm: clearAllScripts
    });
  }

  function clearAllScripts() {
    var ids = state.sections.map(function (s) { return s.id; });
    var fresh = newSection();
    state.sections = [fresh];
    state.lastEditAt = null; state.approved = false; state.docResult = null;
    collapsed = {}; persistCollapsed();
    confirmState = null; clearing = true;
    paint();
    var failed = 0, chain = Promise.resolve();
    if (dbApi) {
      ids.forEach(function (id) { chain = chain.then(function () { return dbApi.doc('scripts/' + id).delete().catch(function () { failed += 1; }); }); });
      chain = chain.then(function () { return saveSection(fresh.id); }).then(function () { return saveMeta(); });
    }
    return chain.then(function () {
      clearing = false;
      flash = failed
        ? 'Cleared the workbench, but ' + failed + ' script' + plural(failed) + ' could not be removed from storage and may come back when you reload. Try Clear All once more.'
        : 'Cleared ' + ids.length + ' script' + plural(ids.length) + '. Your book title and word list are still here — paste in the next book whenever you’re ready.';
      paint();
    });
  }

  /* ---- Building the Google Doc ---- */

  function docTitle() { return (state.bookTitle.trim() || 'Untitled') + ' — Audio Guide Scripts'; }

  function scriptBody(s, withHeading) {
    var edited = s.status === 'edited';
    var body = withHeading ? '<h2>' + esc(s.name || 'Untitled script') + '</h2>' : '';
    if (!edited) body += '<p><em>Not run through the edit pass — shown as originally entered.</em></p>';
    if (edited) return body + blocksToHtml(layoutBlocks(s), true);
    var paras = [];
    String(s.raw || '').split(/\n{2,}/).forEach(function (para) { if (para.trim()) paras.push('<p>' + esc(para).replace(/\n/g, '<br>') + '</p>'); });
    return body + paras.join(DOC_GAP);
  }
  function docBody() {
    return '<h1>' + esc(docTitle()) + '</h1>' + state.sections.map(function (s) { return scriptBody(s, true); }).join('');
  }
  var DOC_STYLE = '<style>body{font-family:Georgia,serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.55;color:#222}p{margin:0}h1{font-size:26px}h2{font-size:19px;margin-top:36px}em{color:#777}blockquote{margin:0 0 0 24px;padding-left:12px;border-left:3px solid #c9b48a}</style>';
  // One wrapper for every document the tool emits: Drive gets a bare document, the download a styled one.
  function wrapDoc(body, styled) {
    return styled ? '<!doctype html><html><head><meta charset="utf-8"><title>' + esc(docTitle()) + '</title>' + DOC_STYLE + '</head><body>' + body + '</body></html>' : '<html><body>' + body + '</body></html>';
  }
  function scriptDocHtml(s) { return wrapDoc('<h1>' + esc(s.name || 'Untitled script') + '</h1>' + scriptBody(s, false), false); }
  function downloadName() { return ((state.bookTitle.trim() || 'audio-guide').replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') || 'audio-guide') + '-scripts.html'; }

  function saveDownload(isFallback) {
    return useCap('downloads').then(function (downloads) {
      if (!downloads) { state.docResult = { method: 'error', message: 'Downloads aren’t available in this view — use Copy on each corrected script instead.' }; return; }
      return downloads.save({ filename: downloadName(), data: wrapDoc(docBody(), true) }).then(function () {
        state.docResult = { method: 'download', at: Date.now() };
      }).catch(function (err) {
        if (err && err.code === 'declined') state.docResult = isFallback ? { method: 'error', message: 'Google Drive isn’t connected, and the file save was declined. Connect Google Drive in Settings → Connectors, or try again.' } : null;
        else state.docResult = { method: 'error', message: 'Couldn’t save a copy: ' + ((err && err.message) || 'unknown error') };
      });
    });
  }

  function paintDocResult() {
    var footer = root.querySelector('.conclude-bar');
    if (!footer) return;
    var old = footer.querySelector('.doc-result, .doc-link-line');
    var html = renderDocResult();
    if (old) old.outerHTML = html; else footer.insertAdjacentHTML('beforeend', html);
  }

  function driveTool(mcp) {
    return mcp.listTools().then(function (list) {
      var servers = (list && list.servers) || [];
      var server = servers.filter(function (sv) { return sv.server === 'Google Drive'; })[0];
      var tool = server && server.tools.filter(function (t) { return /create.*file/i.test(t.name); })[0];
      return (server && tool) ? tool.name : null;
    });
  }
  function payloadOf(res) {
    var payload = res && res.payload;
    if (!payload && res && res.content && res.content[0] && res.content[0].text) { try { payload = JSON.parse(res.content[0].text); } catch (e) {} }
    return payload || {};
  }
  function urlOf(p) { return p && (p.viewUrl || p.webViewLink || p.url) || ''; }

  function conclude() {
    syncFieldsFromDom();
    state.docResult = { method: 'pending', progress: docMode === 'perScript' ? 'Creating a folder in your Google Drive…' : 'Building your Google Doc…' };
    paint();
    useCap('mcp').then(function (mcp) {
      if (!mcp) return false;
      return driveTool(mcp).then(function (toolName) {
        if (!toolName) return false;
        if (docMode !== 'perScript') {
          return mcp.callTool('Google Drive', toolName, { title: docTitle(), textContent: wrapDoc(docBody(), false), contentMimeType: 'text/html' }).then(function (res) {
            var url = urlOf(payloadOf(res));
            state.docResult = { method: 'drive', url: url || '#', at: Date.now() };
            if (url) { state.lastDoc = { url: url, at: Date.now(), kind: 'doc' }; saveMeta(); }
            return true;
          });
        }
        // One Doc per script, inside a new folder named for the book.
        return mcp.callTool('Google Drive', toolName, { title: docTitle(), contentMimeType: 'application/vnd.google-apps.folder' }).then(function (res) {
          var folder = payloadOf(res), folderId = folder && folder.id, folderUrl = urlOf(folder);
          if (!folderId) throw { code: 'no_folder' };
          var queue = state.sections.slice(), done = 0, failed = 0;
          function next() {
            var s = queue.shift();
            if (!s) return Promise.resolve();
            state.docResult = { method: 'pending', progress: 'Creating Doc ' + (done + failed + 1) + ' of ' + state.sections.length + ' — ' + (s.name || 'Untitled script') + '…' };
            paintDocResult();
            return mcp.callTool('Google Drive', toolName, { title: s.name || 'Untitled script', textContent: scriptDocHtml(s), contentMimeType: 'text/html', parentId: folderId })
              .then(function () { done += 1; }, function (err) { failed += 1; console.warn('Scriptorium: doc failed for ' + s.name, err); })
              .then(next);
          }
          return next().then(function () {
            state.docResult = { method: 'drive', url: folderUrl || '#', at: Date.now(), count: done, failed: failed };
            if (folderUrl) { state.lastDoc = { url: folderUrl, at: Date.now(), kind: 'folder' }; saveMeta(); }
            return true;
          });
        });
      }).catch(function (err) { console.warn('Scriptorium: Drive create failed', err); return false; });
    }).then(function (driveOk) { if (!driveOk) return saveDownload(true); })
      .then(function () { paint(); });
  }

  /* ==================================================================
     Events
     ================================================================== */

  root.addEventListener('click', function (e) {
    if (e.target.closest('[data-stop-click]') && !e.target.closest('.modal-actions')) return;
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.dataset.action, id = btn.dataset.id;
    if (action === 'confirm-cancel') { closeConfirm(); return; }
    if (action === 'confirm-ok') { var fn = confirmState && confirmState.onConfirm; if (fn) fn(); return; }
    if (action === 'dismiss-flash') { flash = null; paint(); return; }
    if (action === 'clear-all') { askClearAll(); return; }
    if (action === 'add-section') addSection();
    else if (action === 'remove-section') removeSection(id);
    else if (action === 'toggle-collapse') toggleCollapse(id);
    else if (action === 'collapse-edited') collapseEdited();
    else if (action === 'expand-all') expandAll();
    else if (action === 'copy-corrected') copyCorrected(id, btn);
    else if (action === 'edit-all') editAll();
    else if (action === 'stop-edit') stopEdit();
    else if (action === 'redo-section') redoSection(id);
    else if (action === 'conclude') conclude();
    else if (action === 'download-copy') { syncFieldsFromDom(); saveDownload(false).then(function () { paint(); }); }
  });

  root.addEventListener('change', function (e) {
    var t = e.target;
    if (!t || !t.dataset) return;
    if (t.dataset.action === 'toggle-approve') toggleApprove(t.checked);
    if (t.dataset.action === 'set-concurrency') { concurrency = Number(t.value) === 1 ? 1 : 2; prefSet('concurrency', concurrency); }
    if (t.dataset.action === 'set-repair') { repairParagraphs = !!t.checked; prefSet('repairParagraphs', repairParagraphs); }
    if (t.dataset.action === 'set-docmode') { docMode = t.value === 'one' ? 'one' : 'perScript'; prefSet('docMode', docMode); paint(); }
  });

  function fieldTouched(el) {
    if (!el || !el.dataset || !el.dataset.field || dbStatus === 'loading') return;
    syncOneField(el);
    if (el.dataset.id) saveSectionSoon(el.dataset.id); else saveMetaSoon();
    if (el.dataset.field === 'raw' && el.dataset.id) { var s = findSection(el.dataset.id); if (s && s.status === 'edited') paintChipOnly(s); }
  }
  root.addEventListener('input', function (e) { fieldTouched(e.target); });
  root.addEventListener('focusout', function (e) { fieldTouched(e.target); });

  root.addEventListener('keydown', function (e) {
    // Enter in a script's title moves on to its transcript box.
    if (e.key === 'Enter' && e.target && e.target.dataset && e.target.dataset.field === 'name') {
      e.preventDefault();
      var ta = root.querySelector('[data-field="raw"][data-id="' + e.target.dataset.id + '"]');
      if (ta) { try { ta.focus(); } catch (err) {} }
    }
  });

  document.addEventListener('keydown', function (e) {
    if (!confirmState) return;
    if (e.key === 'Escape') { e.preventDefault(); closeConfirm(); return; }
    if (e.key === 'Tab') {
      var buttons = Array.prototype.slice.call(root.querySelectorAll('.modal-actions .btn'));
      if (!buttons.length) return;
      var idx = buttons.indexOf(document.activeElement);
      e.preventDefault();
      var next = e.shiftKey ? (idx <= 0 ? buttons.length - 1 : idx - 1) : (idx === -1 || idx === buttons.length - 1 ? 0 : idx + 1);
      try { buttons[next].focus(); } catch (err) {}
    }
  });

  window.addEventListener('pagehide', flushSaves);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushSaves(); });

  paint();
  initStore();
})();
</script>

</body></html>
