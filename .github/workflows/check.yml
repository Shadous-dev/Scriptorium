# Runs on every push and pull request. Fails if dist/index.html has drifted from src/,
# or if a rule in SOURCE-OF-TRUTH section 4 no longer holds.
name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: dist/index.html matches src/
        run: node build.js --check
      - name: Caption rules hold
        run: node test/captions.test.js
      - name: Descript pull holds
        run: node test/descript.test.js
      - name: Edit rules hold
        run: node test/edit-rules.test.js
      - name: Written scripts and sign-off hold
        run: node test/written-scripts.test.js
      - name: Reference checks hold
        run: node test/references.test.js
      - name: Google export and import hold
        run: node test/google-export-import.test.js
      - name: Stored data is safe, saves are in order, sizes are checked
        run: node test/store-safety.test.js
      - name: The glossary holds only what a person approved
        run: node test/glossary.test.js
      - name: Every kind of file is read, many at once
        run: node test/many-files.test.js
      - name: The Final Transcripts download as a PDF or a web page
        run: node test/export.test.js
      - name: Every guide says whether a written script was used
        run: node test/script-status.test.js
      - name: A book's files go to one Google Drive folder
        run: node test/drive-folder.test.js
